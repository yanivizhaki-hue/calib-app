<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calibration Interval Evaluation</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;direction:ltr}
select,button,input{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {createElement:h,useState,useRef,useEffect,Fragment}=React;

// ── Constants ──────────────────────────────────────────────────────────────────
const RED="#dc2626",PASS_GREEN="#16a34a",FAIL_RED="#dc2626";
const AUTO_BG="#f8fafc",INPUT_BG="#fff8f8",REF_BG="#fffbeb",REF_BORDER="#fde68a";

const QUANTITIES=[
  {sym:"V",label:"Voltage (V)"},{sym:"A",label:"Current (A)"},{sym:"Ω",label:"Resistance (Ω)"},
  {sym:"g",label:"Mass (g)"},{sym:"N",label:"Force (N)"},{sym:"kgf",label:"Force (kgf)"},
  {sym:"Pa",label:"Pressure (Pa)"},{sym:"bar",label:"Pressure (bar)"},
  {sym:"°C",label:"Temperature (°C)"},{sym:"K",label:"Temperature (K)"},
  {sym:"Hz",label:"Frequency (Hz)"},{sym:"s",label:"Time (s)"},{sym:"m",label:"Length (m)"},
  {sym:"L",label:"Volume (L)"},{sym:"W",label:"Power (W)"},{sym:"lx",label:"Illuminance (lx)"},
  {sym:"dB",label:"Level (dB)"},{sym:"pH",label:"pH"},{sym:"%RH",label:"Humidity (%RH)"},
  {sym:"rpm",label:"Speed (rpm)"},{sym:"cd",label:"Luminous int. (cd)"},{sym:"mol",label:"Amount (mol)"}
];
const PREFIXES=[
  {sym:"G",label:"Giga (G)"},{sym:"M",label:"Mega (M)"},{sym:"k",label:"Kilo (k)"},
  {sym:"",label:"— (none)"},{sym:"m",label:"Milli (m)"},{sym:"μ",label:"Micro (μ)"},
  {sym:"n",label:"Nano (n)"},{sym:"p",label:"Pico (p)"}
];
const DURATION_OPTS=[{v:1,label:"1 – דקות בודדות"},{v:2,label:"2 – עד שעה"},{v:3,label:"3 – כמה שעות"},{v:4,label:"4 – רוב היום"},{v:5,label:"5 – עבודה רציפה"}];
const FREQ_OPTS=[{v:1,label:"1 – שבועי"},{v:2,label:"2 – כמה פעמים בשבוע"},{v:3,label:"3 – יומי"},{v:4,label:"4 – רוב היום"},{v:5,label:"5 – עבודה רציפה"}];
const ENV_FIXED=[{v:1,label:"1 – מעבדה מבוקרת"},{v:2,label:"2 – שימוש רגיל"},{v:3,label:"3 – תנאים משתנים"},{v:4,label:"4 – שטח"},{v:5,label:"5 – שטח/עומס קיצוני"}];
const ENV_MOBILE=[{v:2,label:"2 – מעבדה מבוקרת"},{v:3,label:"3 – שימוש רגיל"},{v:4,label:"4 – תנאים משתנים"},{v:5,label:"5 – שטח/עומס קיצוני"}];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];

// ── Helpers ────────────────────────────────────────────────────────────────────
function rnd(v,d=0){return Math.round(v*10**d)/10**d}
function fmt(v,d=4){if(v===null||v===undefined||isNaN(v))return"—";return Number(v).toFixed(d)}
function unitLabel(range){return`${range.prefix||""}${range.quantity}`}
function parseDMY(str){if(!str)return null;const p=str.split("/");if(p.length!==3)return null;const d=parseInt(p[0]),m=parseInt(p[1])-1,y=parseInt(p[2]);if(isNaN(d)||isNaN(m)||isNaN(y))return null;return new Date(y,m,d)}
function formatDMY(date){if(!date)return"";return`${String(date.getDate()).padStart(2,"0")}/${String(date.getMonth()+1).padStart(2,"0")}/${date.getFullYear()}`}
const uid=()=>Math.random().toString(36).slice(2);

// ── Data factories ─────────────────────────────────────────────────────────────
const newSharedRow=()=>({id:uid(),calibrationDate:"",certNo:""});
const newRangeRow=()=>({id:uid(),measuredValue:"",timeInterval:"1",adjustment:"0",tolerance:"",uncertainty:"",duration:"2",frequency:"1",environment:"1"});
const newRange=(label,sr)=>({id:uid(),label,quantity:"V",prefix:"",decimals:4,tolPrefix:"",tolDecimals:4,uncPrefix:"",uncDecimals:4,rows:sr.map(()=>newRangeRow())});

// ── Calculation ────────────────────────────────────────────────────────────────
function calcRow(row,prevMeasured,isRef){
  if(isRef)return{isRef:true,drift:null,driftPerYear:null,tur:null,usageScore:null,riskScore:null,driftLtUnc:null,decision:null,failReasons:[]};
  const m=parseFloat(row.measuredValue),p=prevMeasured,ti=parseFloat(row.timeInterval);
  const tol=parseFloat(row.tolerance),unc=parseFloat(row.uncertainty);
  const adj=parseInt(row.adjustment)||0,dur=parseInt(row.duration)||1,freq=parseInt(row.frequency)||1,env=parseInt(row.environment)||1;
  const drift=(!isNaN(m)&&p!==undefined&&!isNaN(p))?m-p:null;
  const driftPerYear=(drift!==null&&!isNaN(ti)&&ti!==0)?drift/ti:null;
  const tur=(!isNaN(tol)&&!isNaN(unc)&&unc!==0)?tol/unc:null;
  const usageScore=rnd((dur+freq)/2,0),riskScore=rnd((usageScore+env)/2,0);
  const driftLtUnc=(drift!==null&&!isNaN(unc))?(Math.abs(drift)<=unc?"YES":"NO"):null;
  const failReasons=[];
  let decision=null;
  if(drift!==null&&tur!==null&&!isNaN(unc)){
    if(adj!==0)failReasons.push("Adjustment was performed (ADJUSTMENT = 1)");
    if(tur<3)failReasons.push(`TUR = ${fmt(tur,2)} < 3`);
    if(Math.abs(drift)>unc)failReasons.push(`|Drift| = ${fmt(Math.abs(drift),4)} > Uncertainty = ${fmt(unc,4)}`);
    if(env>2)failReasons.push(`Environment = ${env} > 2`);
    if(usageScore>2)failReasons.push(`Usage score = ${usageScore} > 2`);
    if(riskScore>2)failReasons.push(`Risk score = ${riskScore} > 2`);
    decision=failReasons.length===0?"PASS":"FAIL";
  }
  return{isRef:false,drift,driftPerYear,tur,usageScore,riskScore,driftLtUnc,decision,failReasons,adj,env};
}

// ── Report HTML ────────────────────────────────────────────────────────────────
function buildReport({equipmentId,equipmentType,sharedRows,ranges,allRangesCalc,rangePassStatus,globalAllPass,preparedBy,orgName,reportDate}){
  const certRows=sharedRows.map((sr,i)=>`<tr style="background:${i===0?"#fffbeb":i%2===0?"#fff":"#f9fafb"}"><td style="padding:5px 10px;border:1px solid #ddd;font-weight:700;color:${i===0?"#92400e":"#333"}">${i===0?"REF":i}</td><td style="padding:5px 10px;border:1px solid #ddd">${sr.calibrationDate||"—"}</td><td style="padding:5px 10px;border:1px solid #ddd">${sr.certNo||"—"}</td><td style="padding:5px 10px;border:1px solid #ddd;color:#555;font-style:italic">${i===0?"Reference year – base for comparison":`Comparison ${i}: compared against row ${i-1}`}</td></tr>`).join("");
  const rangeSummary=ranges.map((rng,ri)=>{const s=rangePassStatus[ri],c=s==="pass"?"#16a34a":s==="fail"?"#dc2626":"#999";return`<tr><td style="padding:6px 10px;border:1px solid #ddd;font-weight:600">${rng.label} [${unitLabel(rng)}]</td><td style="padding:6px 10px;border:1px solid #ddd;text-align:center;font-weight:800;color:${c}">${s==="pass"?"✓ PASS":s==="fail"?"✗ FAIL":"—"}</td></tr>`;}).join("");
  const verdict=globalAllPass
    ?`<div style="background:#f0fdf4;border:2px solid #16a34a;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#16a34a;margin-bottom:8px">✓ CONCLUSION: Calibration Interval Extension APPROVED</div><p style="font-size:12px;color:#166534;line-height:1.7;margin-bottom:6px">All measurement ranges demonstrated stable performance. All six decision criteria were satisfied for every range and every comparison period.</p><p style="font-size:12px;color:#166534;font-weight:700">Equipment ID: <u>${equipmentId||"N/A"}</u> — calibration interval may be extended by one (1) additional year.</p></div>`
    :`<div style="background:#fef2f2;border:2px solid #dc2626;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#dc2626;margin-bottom:8px">✗ CONCLUSION: Calibration Interval Extension NOT APPROVED</div><p style="font-size:12px;color:#991b1b;line-height:1.7;margin-bottom:6px">One or more ranges did not satisfy all decision criteria. The interval cannot be extended.</p><p style="font-size:12px;color:#991b1b;font-weight:700">Equipment ID: <u>${equipmentId||"N/A"}</u> must be calibrated at the standard interval.</p></div>`;
  const rangeDetails=ranges.map((rng,ri)=>{
    const rCalc=allRangesCalc[ri],status=rangePassStatus[ri],sc=status==="pass"?"#16a34a":"#dc2626",sbg=status==="pass"?"#f0fdf4":"#fef2f2";
    const unit=unitLabel(rng),dec=rng.decimals;
    const dataRows=sharedRows.map((shared,i)=>{
      const isRef=i===0,calc=rCalc[i],rrow=rng.rows[i];
      const prevVal=i>0&&rng.rows[i-1].measuredValue!==""?Number(rng.rows[i-1].measuredValue).toFixed(dec):"—";
      const dc=calc.decision==="PASS"?"#16a34a":calc.decision==="FAIL"?"#dc2626":"#999";
      const measD=rrow.measuredValue!==""&&!isNaN(parseFloat(rrow.measuredValue))?`${Number(rrow.measuredValue).toFixed(dec)} ${unit}`:"—";
      const tolD=rrow.tolerance!==""&&!isNaN(parseFloat(rrow.tolerance))?`${Number(rrow.tolerance).toFixed(rng.tolDecimals)} ${rng.tolPrefix}${rng.quantity}`:(rrow.tolerance||"—");
      const uncD=rrow.uncertainty!==""&&!isNaN(parseFloat(rrow.uncertainty))?`${Number(rrow.uncertainty).toFixed(rng.uncDecimals)} ${rng.uncPrefix}${rng.quantity}`:(rrow.uncertainty||"—");
      return`<tr style="background:${isRef?"#fffbeb":i%2===0?"#fff":"#f9fafb"}"><td style="padding:5px 7px;border:1px solid #e2e8f0;font-weight:700;color:${isRef?"#92400e":"#555"}">${isRef?"REF":i}</td><td style="padding:5px 7px;border:1px solid #e2e8f0">${shared.calibrationDate||"—"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${measD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right;color:#1e40af;font-style:italic">${isRef?"—":prevVal!=="—"?`${prevVal} ${unit}`:"—"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"—":calc.drift!==null?`${fmt(calc.drift,dec)} ${unit}`:"—"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"—":calc.driftPerYear!==null?fmt(calc.driftPerYear,dec):"—"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"—":tolD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"—":uncD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:700;color:${calc.tur!==null?(calc.tur>=3?"#16a34a":"#dc2626"):"#999"}">${isRef?"—":fmt(calc.tur,2)}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center">${isRef?"—":rrow.adjustment}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:600;color:${!isRef&&calc.usageScore>2?"#dc2626":"#16a34a"}">${isRef?"—":(calc.usageScore??"-")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:600;color:${!isRef&&calc.riskScore>2?"#dc2626":"#16a34a"}">${isRef?"—":(calc.riskScore??"-")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:700;color:${calc.driftLtUnc==="YES"?"#16a34a":calc.driftLtUnc==="NO"?"#dc2626":"#999"}">${isRef?"—":(calc.driftLtUnc||"—")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:800;color:${dc}">${isRef?"—":(calc.decision||"—")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0">${shared.certNo||"—"}</td></tr>`;
    }).join("");
    const rowAnalysis=rCalc.slice(1).map((calc,idx)=>{
      const rowNum=idx+1,shared=sharedRows[rowNum];
      if(!calc.decision)return"";
      if(calc.decision==="PASS"){const uRow=rng.rows[rowNum];const uncD=uRow?.uncertainty!==""&&!isNaN(parseFloat(uRow?.uncertainty))?`${Number(uRow.uncertainty).toFixed(rng.uncDecimals)} ${rng.uncPrefix}${rng.quantity}`:(uRow?.uncertainty||"—");return`<div style="margin-top:6px;padding:8px 12px;background:#f0fdf4;border-left:3px solid #16a34a;border-radius:4px;font-size:11px;line-height:1.7"><strong>Row ${rowNum} (${shared.calibrationDate||"—"}) — PASS:</strong> No adj · TUR=${fmt(calc.tur,2)} ≥ 3 · |Drift|=${fmt(Math.abs(calc.drift),dec)} ${unit} ≤ Unc ${uncD} · Env=${calc.env} ≤ 2 · Usage=${calc.usageScore} ≤ 2 · Risk=${calc.riskScore} ≤ 2</div>`;}
      return`<div style="margin-top:6px;padding:8px 12px;background:#fef2f2;border-left:3px solid #dc2626;border-radius:4px;font-size:11px"><strong>Row ${rowNum} (${shared.calibrationDate||"—"}) — FAIL:</strong><ul style="margin:4px 0 0 18px;padding:0;line-height:1.8">${calc.failReasons.map(r=>`<li>${r}</li>`).join("")}</ul></div>`;
    }).join("");
    return`<div style="margin-bottom:28px;page-break-inside:avoid"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:10px 14px;background:${sbg};border:1.5px solid ${sc};border-radius:8px"><h3 style="margin:0;font-size:14px">${rng.label} <span style="font-size:11px;font-weight:400;color:#475569">[${unit}]</span></h3><span style="font-size:13px;font-weight:800;color:${sc}">${status==="pass"?"✓ ALL PASS":"✗ FAIL"}</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#0f172a;color:#e2e8f0"><th style="padding:6px 7px;border:1px solid #1e293b">#</th><th style="padding:6px 7px;border:1px solid #1e293b">Date</th><th style="padding:6px 7px;border:1px solid #1e293b">Measured (${unit})</th><th style="padding:6px 7px;border:1px solid #1e293b">Previous</th><th style="padding:6px 7px;border:1px solid #1e293b">Drift</th><th style="padding:6px 7px;border:1px solid #1e293b">Drift/Yr</th><th style="padding:6px 7px;border:1px solid #1e293b">Tolerance [${rng.tolPrefix}${rng.quantity}]</th><th style="padding:6px 7px;border:1px solid #1e293b">Uncertainty [${rng.uncPrefix}${rng.quantity}]</th><th style="padding:6px 7px;border:1px solid #1e293b">TUR</th><th style="padding:6px 7px;border:1px solid #1e293b">Adj</th><th style="padding:6px 7px;border:1px solid #1e293b">Usage</th><th style="padding:6px 7px;border:1px solid #1e293b">Risk</th><th style="padding:6px 7px;border:1px solid #1e293b">D&lt;U</th><th style="padding:6px 7px;border:1px solid #1e293b">Decision</th><th style="padding:6px 7px;border:1px solid #1e293b">Cert.NO</th></tr></thead><tbody>${dataRows}</tbody></table></div>${rowAnalysis?`<div style="margin-top:10px"><strong style="font-size:11px;color:#475569;display:block;margin-bottom:4px">Row-by-row analysis:</strong>${rowAnalysis}</div>`:""}</div>`;
  }).join("");
  const today=reportDate||new Date().toLocaleDateString("en-GB");
  return`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Calibration Report – ${equipmentId||"Equipment"}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#0f172a;background:#fff;font-size:12px}.page{max-width:860px;margin:0 auto;padding:32px 36px}h2{font-size:13px;font-weight:700;border-bottom:2px solid #0f172a;padding-bottom:4px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 12px}.mi label{display:block;font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}.mi span{font-size:12px;font-weight:600}.fml{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}.fml td{padding:4px 8px;border:1px solid #e2e8f0}.fml td:first-child{font-weight:600;background:#f8fafc;width:32%}ul.crit{margin:0;padding:0 0 0 18px;font-size:11px;line-height:1.9;color:#334155}.sig{border:1px solid #e2e8f0;border-radius:8px;padding:16px 20px;margin-top:8px}.sl{border-top:1px solid #334155;margin-top:30px;width:200px;font-size:10px;color:#555;padding-top:4px}.disc{font-size:10px;color:#94a3b8;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:10px;line-height:1.6}@media print{.noprint{display:none!important}.page{padding:16px 20px}}</style></head><body><div class="noprint" style="background:#1e40af;padding:12px 24px;display:flex;align-items:center;justify-content:space-between"><span style="color:#fff;font-weight:700;font-size:14px">Calibration Interval Evaluation Report</span><button onclick="window.print()" style="background:#fff;color:#1e40af;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer">🖨 Print / Save as PDF</button></div><div class="page"><div style="border-bottom:3px solid #0f172a;padding-bottom:14px;margin-bottom:18px"><div style="font-size:20px;font-weight:800">CALIBRATION INTERVAL EVALUATION REPORT</div><div style="font-size:10px;color:#64748b">ISO/IEC 17025:2017 · ILAC G24 / OIML D10 · JCGM 100 (GUM)</div></div><h2>1. Instrument Identification</h2><div class="mg"><div class="mi"><label>Equipment ID</label><span>${equipmentId||"—"}</span></div><div class="mi"><label>Equipment Type</label><span>${equipmentType==="mobile"?"Mobile (ציוד נייד)":"Stationary (ציוד נייח)"}</span></div><div class="mi"><label>Report Date</label><span>${today}</span></div><div class="mi"><label>Years Evaluated</label><span>${sharedRows.length-1} comparison + 1 reference</span></div><div class="mi"><label>Ranges</label><span>${ranges.length} (${ranges.map(r=>`${r.label} [${unitLabel(r)}]`).join(", ")})</span></div><div class="mi"><label>Prepared By</label><span>${preparedBy||"—"}</span></div><div class="mi" style="grid-column:1/-1"><label>Organization</label><span>${orgName||"—"}</span></div></div><div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:10px 16px;margin:0 0 16px;font-size:11px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">✓</span><div><strong style="color:#16a34a">Certificate Exceedances: None reported</strong><br><span style="color:#166534">The operator confirmed that no exceedances exist in any of the calibration certificates evaluated.</span></div></div><h2>2. Calibration Certificates Referenced</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">#</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Date</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Certificate No.</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Role</th></tr></thead><tbody>${certRows}</tbody></table><h2>3. Evaluation Result</h2>${verdict}<table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:10px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Range</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:center">Result</th></tr></thead><tbody>${rangeSummary}</tbody></table><h2>4. Methodology</h2><p style="font-size:11px;color:#334155;line-height:1.7;margin-bottom:10px">Follows <strong>ISO/IEC 17025:2017</strong> (Clauses 6.4.7, 7.6, 7.7, 7.8.6), <strong>ILAC G24/OIML D10</strong>, and <strong>JCGM 100:2008 (GUM)</strong>. Extension approved only when all criteria satisfied for all ranges and all periods.</p><table class="fml"><tr><td>Drift</td><td>Measured<sub>n</sub> − Measured<sub>n−1</sub></td></tr><tr><td>Drift per Year</td><td>Drift ÷ Time Interval (years)</td></tr><tr><td>TUR</td><td>Tolerance ÷ Uncertainty</td></tr><tr><td>Usage score</td><td>ROUND((Duration + Frequency) ÷ 2, 0)</td></tr><tr><td>Risk score</td><td>ROUND((Usage score + Environment) ÷ 2, 0)</td></tr></table><p style="font-size:11px;font-weight:700;margin:10px 0 5px">FAIL conditions (any single condition triggers FAIL):</p><ul class="crit"><li><strong>ADJUSTMENT = 1</strong> — Adjustment performed between calibrations</li><li><strong>TUR &lt; 3</strong> — Insufficient test uncertainty ratio</li><li><strong>|Drift| &gt; Uncertainty</strong> — Drift exceeds measurement uncertainty</li><li><strong>Environment &gt; 2</strong> — Harsh operating environment</li><li><strong>Usage score &gt; 2</strong> — Intensive use</li><li><strong>Risk score &gt; 2</strong> — High combined risk index</li></ul><h2>5. Detailed Results by Range</h2>${rangeDetails}<h2>6. Authorization</h2><div class="sig"><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px"><div><div class="sl">Prepared by: ${preparedBy||"________________________"}</div><div style="font-size:10px;color:#555;margin-top:8px">Title: ________________________</div><div style="font-size:10px;color:#555;margin-top:6px">Date: ${today}</div></div><div><div class="sl">Reviewed / Approved by: ________________________</div><div style="font-size:10px;color:#555;margin-top:8px">Title: ________________________</div><div style="font-size:10px;color:#555;margin-top:6px">Date: ________________________</div></div></div></div><div class="disc">Generated by the Calibration Interval Evaluation System. Based on user-entered data. For inclusion in the instrument's calibration file (תיק צב"ד) and presentation to ANAB/ILAC auditors. The laboratory retains full responsibility for data accuracy and accreditation compliance.</div></div></body></html>`;
}

// ── DatePicker ─────────────────────────────────────────────────────────────────
function DatePicker({value,onChange,placeholder="DD/MM/YYYY",inputStyle={}}){
  const[open,setOpen]=useState(false);
  const parsed=parseDMY(value);
  const today=new Date();
  const[viewYear,setViewYear]=useState(parsed?parsed.getFullYear():today.getFullYear());
  const[viewMonth,setViewMonth]=useState(parsed?parsed.getMonth():today.getMonth());
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);
  const dim=(y,m)=>new Date(y,m+1,0).getDate();
  const fd=(y,m)=>new Date(y,m,1).getDay();
  const prev=()=>{if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1)}else setViewMonth(m=>m-1)};
  const next=()=>{if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1)}else setViewMonth(m=>m+1)};
  const sel=d=>{onChange(formatDMY(new Date(viewYear,viewMonth,d)));setOpen(false)};
  const cells=[];
  for(let i=0;i<fd(viewYear,viewMonth);i++)cells.push(null);
  for(let d=1;d<=dim(viewYear,viewMonth);d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const isSel=d=>parsed&&d&&parsed.getFullYear()===viewYear&&parsed.getMonth()===viewMonth&&parsed.getDate()===d;
  const isTod=d=>d&&today.getFullYear()===viewYear&&today.getMonth()===viewMonth&&today.getDate()===d;
  const S={position:"relative",display:"inline-block",width:"100%"};
  const calS={position:"absolute",top:"100%",left:0,zIndex:9999,background:"#fff",border:"1px solid #cbd5e1",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,.18)",padding:10,minWidth:220,marginTop:2};
  return h("div",{ref,style:S},
    h("div",{style:{display:"flex",alignItems:"center",width:"100%"}},
      h("input",{readOnly:true,value,placeholder,onClick:()=>setOpen(o=>!o),style:{...inputStyle,cursor:"pointer",paddingRight:22,boxSizing:"border-box"}}),
      h("span",{onClick:()=>setOpen(o=>!o),style:{position:"absolute",right:4,cursor:"pointer",fontSize:13,color:"#64748b",pointerEvents:"none"}},"📅")
    ),
    open&&h("div",{style:calS},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        h("button",{onClick:prev,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"‹"),
        h("span",{style:{fontWeight:700,fontSize:12,color:"#0f172a"}},MONTHS[viewMonth]+" "+viewYear),
        h("button",{onClick:next,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"›")
      ),
      h("div",{style:{display:"flex",justifyContent:"center",gap:4,marginBottom:8}},
        [viewYear-2,viewYear-1,viewYear,viewYear+1,viewYear+2].map(y=>h("button",{key:y,onClick:()=>setViewYear(y),style:{fontSize:10,padding:"2px 5px",border:"1px solid",borderColor:y===viewYear?"#2563eb":"#e2e8f0",borderRadius:4,background:y===viewYear?"#2563eb":"#fff",color:y===viewYear?"#fff":"#475569",cursor:"pointer",fontWeight:y===viewYear?700:400}},y))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}},
        DAYS.map(d=>h("div",{key:d,style:{textAlign:"center",fontSize:10,fontWeight:700,color:"#94a3b8"}},d))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}},
        cells.map((d,idx)=>h("button",{key:idx,onClick:()=>d&&sel(d),style:{textAlign:"center",fontSize:11,padding:"4px 2px",border:"none",borderRadius:5,cursor:d?"pointer":"default",background:isSel(d)?"#2563eb":isTod(d)?"#eff6ff":"transparent",color:!d?"transparent":isSel(d)?"#fff":isTod(d)?"#2563eb":"#334155",fontWeight:isSel(d)||isTod(d)?700:400}},d||""))
      ),
      h("div",{style:{marginTop:8,textAlign:"center"}},
        h("button",{onClick:()=>{const t=new Date();setViewYear(t.getFullYear());setViewMonth(t.getMonth());sel(t.getDate())},style:{fontSize:11,color:"#2563eb",background:"none",border:"none",cursor:"pointer",fontWeight:600}},"Today"),
        h("button",{onClick:()=>{onChange("");setOpen(false)},style:{fontSize:11,color:"#94a3b8",background:"none",border:"none",cursor:"pointer",marginLeft:10}},"Clear")
      )
    )
  );
}

  const[ranges,setRanges]=useState(()=>[newRange("Range 1",[null,null,null])]);
  const[activeRange,setActiveRange]=useState(0);
  const[showModal,setShowModal]=useState(false);
  const[preparedBy,setPreparedBy]=useState("");
  const[orgName,setOrgName]=useState("");

  const[view,setView]=useState("main");
  const[reportHtml,setReportHtml]=useState("");
  const[hasExceedance,setHasExceedance]=useState(null);

  const envOpts=equipmentType==="mobile"?ENV_MOBILE:ENV_FIXED;

  function syncRangeRows(ns,cr){return cr.map(range=>({...range,rows:ns.map((_,i)=>range.rows[i]||newRangeRow())}))}
  function addSharedRow(){if(sharedRows.length>=6)return;const s=[...sharedRows,newSharedRow()];setSharedRows(s);setRanges(rs=>syncRangeRows(s,rs))}
  function removeSharedRow(idx){if(sharedRows.length<=2||idx===0)return;const s=sharedRows.filter((_,i)=>i!==idx);setSharedRows(s);setRanges(rs=>syncRangeRows(s,rs))}
  function updateShared(idx,field,val){setSharedRows(rs=>rs.map((r,i)=>i===idx?{...r,[field]:val}:r))}
  function updateRangeRow(ri,rowIdx,field,val){
    setRanges(rs=>rs.map((range,r)=>{
      if(r!==ri)return range;
      if(rowIdx===0&&(field==="tolerance"||field==="uncertainty")){
        const cv=range.rows[0][field];
        return{...range,rows:range.rows.map((row,rowi)=>{if(rowi===0)return{...row,[field]:val};if(row[field]===""||row[field]===cv)return{...row,[field]:val};return row;})};
      }
      return{...range,rows:range.rows.map((row,rowi)=>rowi!==rowIdx?row:{...row,[field]:val})};
    }));
  }
  function updateRange(ri,field,val){setRanges(rs=>rs.map((r,i)=>i!==ri?r:{...r,[field]:val}))}
  function addRange(){const l=`Range ${ranges.length+1}`;setRanges(rs=>[...rs,newRange(l,sharedRows)]);setActiveRange(ranges.length)}
  function removeRange(idx){if(ranges.length<=1)return;setRanges(rs=>rs.filter((_,i)=>i!==idx));setActiveRange(prev=>Math.min(prev,ranges.length-2))}
  function updateRangeLabel(idx,label){setRanges(rs=>rs.map((r,i)=>i===idx?{...r,label}:r))}

  const range=ranges[activeRange],dec=range.decimals,unit=unitLabel(range);
  const calculated=sharedRows.map((_,i)=>calcRow(range.rows[i],i>0?parseFloat(range.rows[i-1].measuredValue):undefined,i===0));
  const allRangesCalc=ranges.map(rng=>sharedRows.map((_,i)=>calcRow(rng.rows[i],i>0?parseFloat(rng.rows[i-1].measuredValue):undefined,i===0)));

  const hasAnyDecision=allCompDecisions.some(d=>d!==null);
