<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calibration Interval Evaluation</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9}
select,button,input{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {createElement:h,useState,useRef,useEffect}=React;

const RED="#dc2626",PASS_GREEN="#16a34a",FAIL_RED="#dc2626";
const AUTO_BG="#f8fafc",INPUT_BG="#fff8f8",REF_BG="#fffbeb",REF_BORDER="#fde68a";

const QUANTITIES=[
  {sym:"V",label:"Voltage (V)"},{sym:"A",label:"Current (A)"},{sym:"\u03a9",label:"Resistance (\u03a9)"},
  {sym:"g",label:"Mass (g)"},{sym:"N",label:"Force (N)"},{sym:"kgf",label:"Force (kgf)"},
  {sym:"Pa",label:"Pressure (Pa)"},{sym:"bar",label:"Pressure (bar)"},
  {sym:"\u00b0C",label:"Temperature (\u00b0C)"},{sym:"K",label:"Temperature (K)"},
  {sym:"Hz",label:"Frequency (Hz)"},{sym:"s",label:"Time (s)"},{sym:"m",label:"Length (m)"},
  {sym:"L",label:"Volume (L)"},{sym:"W",label:"Power (W)"},{sym:"lx",label:"Illuminance (lx)"},
  {sym:"dB",label:"Level (dB)"},{sym:"pH",label:"pH"},{sym:"%RH",label:"Humidity (%RH)"},
  {sym:"rpm",label:"Speed (rpm)"},{sym:"cd",label:"Luminous int. (cd)"},{sym:"mol",label:"Amount (mol)"}
];
const PREFIXES=[
  {sym:"G",label:"Giga (G)"},{sym:"M",label:"Mega (M)"},{sym:"k",label:"Kilo (k)"},
  {sym:"",label:"\u2014 (none)"},{sym:"m",label:"Milli (m)"},{sym:"\u03bc",label:"Micro (\u03bc)"},
  {sym:"n",label:"Nano (n)"},{sym:"p",label:"Pico (p)"}
];
const DUR_OPTS=[{v:1,label:"1 \u2013 \u05d3\u05e7\u05d5\u05ea \u05d1\u05d5\u05d3\u05d3\u05d5\u05ea"},{v:2,label:"2 \u2013 \u05e2\u05d3 \u05e9\u05e2\u05d4"},{v:3,label:"3 \u2013 \u05db\u05de\u05d4 \u05e9\u05e2\u05d5\u05ea"},{v:4,label:"4 \u2013 \u05e8\u05d5\u05d1 \u05d4\u05d9\u05d5\u05dd"},{v:5,label:"5 \u2013 \u05e2\u05d1\u05d5\u05d3\u05d4 \u05e8\u05e6\u05d9\u05e4\u05d4"}];
const FRQ_OPTS=[{v:1,label:"1 \u2013 \u05e9\u05d1\u05d5\u05e2\u05d9"},{v:2,label:"2 \u2013 \u05db\u05de\u05d4 \u05e4\u05e2\u05de\u05d9\u05dd/\u05e9\u05d1\u05d5\u05e2"},{v:3,label:"3 \u2013 \u05d9\u05d5\u05de\u05d9"},{v:4,label:"4 \u2013 \u05e8\u05d5\u05d1 \u05d4\u05d9\u05d5\u05dd"},{v:5,label:"5 \u2013 \u05e2\u05d1\u05d5\u05d3\u05d4 \u05e8\u05e6\u05d9\u05e4\u05d4"}];
const ENV_FIX=[{v:1,label:"1 \u2013 \u05de\u05e2\u05d1\u05d3\u05d4 \u05de\u05d1\u05d5\u05e7\u05e8\u05ea"},{v:2,label:"2 \u2013 \u05e9\u05d9\u05de\u05d5\u05e9 \u05e8\u05d2\u05d9\u05dc"},{v:3,label:"3 \u2013 \u05ea\u05e0\u05d0\u05d9\u05dd \u05de\u05e9\u05ea\u05e0\u05d9\u05dd"},{v:4,label:"4 \u2013 \u05e9\u05d8\u05d7"},{v:5,label:"5 \u2013 \u05e9\u05d8\u05d7/\u05e2\u05d5\u05de\u05e1 \u05e7\u05d9\u05e6\u05d5\u05e0\u05d9"}];
const ENV_MOB=[{v:2,label:"2 \u2013 \u05de\u05e2\u05d1\u05d3\u05d4 \u05de\u05d1\u05d5\u05e7\u05e8\u05ea"},{v:3,label:"3 \u2013 \u05e9\u05d9\u05de\u05d5\u05e9 \u05e8\u05d2\u05d9\u05dc"},{v:4,label:"4 \u2013 \u05ea\u05e0\u05d0\u05d9\u05dd \u05de\u05e9\u05ea\u05e0\u05d9\u05dd"},{v:5,label:"5 \u2013 \u05e9\u05d8\u05d7/\u05e2\u05d5\u05de\u05e1 \u05e7\u05d9\u05e6\u05d5\u05e0\u05d9"}];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WDAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];

function rnd(v,d=0){return Math.round(v*Math.pow(10,d))/Math.pow(10,d)}
function fmt(v,d=4){if(v===null||v===undefined||isNaN(v))return"\u2014";return Number(v).toFixed(d)}
function unitOf(range){return (range.prefix||"")+(range.quantity||"V")}
function parseDMY(s){if(!s)return null;const p=s.split("/");if(p.length!==3)return null;const d=+p[0],mo=+p[1]-1,y=+p[2];if(isNaN(d)||isNaN(mo)||isNaN(y))return null;return new Date(y,mo,d)}
function fmtDMY(dt){if(!dt)return"";return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear()}
const uid=()=>Math.random().toString(36).slice(2);

function calcRow(row,prevMeasured,isRef){
  const EMPTY={isRef,drift:null,driftPerYear:null,tur:null,usageScore:null,riskScore:null,driftLtUnc:null,decision:null,failReasons:[]};
  if(isRef)return EMPTY;
  // Drift = Measured - Previous (no other fields needed)
  const m=parseFloat(row.measuredValue),p=prevMeasured,ti=parseFloat(row.timeInterval);
  const tol=parseFloat(row.tolerance),unc=parseFloat(row.uncertainty);
  const nom=parseFloat(row.nominalValue);
  // Exceedance check: |Measured - Nominal| + Uncertainty < Tolerance
  // true = within limits (no exceedance), false = EXCEEDANCE
  const exceedOk=(!isNaN(m)&&!isNaN(nom)&&!isNaN(unc)&&!isNaN(tol))
    ?((Math.abs(m-nom)+unc)<tol)
    :null;
  const drift=(!isNaN(m)&&p!==undefined&&!isNaN(p))?m-p:null;
  // Drift per Year needs Time Interval
  const driftPerYear=(drift!==null&&!isNaN(ti)&&ti!==0)?drift/ti:null;
  // TUR needs Tolerance + Uncertainty
  const tur=(!isNaN(tol)&&!isNaN(unc)&&unc!==0)?tol/unc:null;
  // Drift<Unc needs Uncertainty
  const driftLtUnc=(drift!==null&&!isNaN(unc))?(Math.abs(drift)<=unc?"YES":"NO"):null;
  // Decision requires ALL fields to be filled
  if(row.adjustment===""||row.duration===""||row.frequency===""||row.environment===""){
    return{isRef:false,drift,driftPerYear,tur,usageScore:null,riskScore:null,driftLtUnc,exceedOk,decision:null,failReasons:[],env:null};
  }
  const adj=parseInt(row.adjustment),dur=parseInt(row.duration),freq=parseInt(row.frequency),env=parseInt(row.environment);
  const usageScore=rnd((dur+freq)/2,0);
  const riskScore=rnd((usageScore+env)/2,0);
  const fail=[];
  let decision=null;
  if(drift!==null&&tur!==null&&!isNaN(unc)){
    if(adj!==0)fail.push("Adjustment performed (ADJUSTMENT=1)");
    if(tur<3)fail.push("TUR="+fmt(tur,2)+" < 3");
    if(Math.abs(drift)>unc)fail.push("|Drift|="+fmt(Math.abs(drift),4)+" > Uncertainty="+fmt(unc,4));
    if(env>2)fail.push("Environment="+env+" > 2");
    if(usageScore>2)fail.push("Usage score="+usageScore+" > 2");
    if(riskScore>2)fail.push("Risk score="+riskScore+" > 2");
    decision=fail.length===0?"PASS":"FAIL";
  }
  return{isRef:false,drift,driftPerYear,tur,usageScore,riskScore,driftLtUnc,exceedOk,decision,failReasons:fail,env};
}

const newSharedRow=()=>({id:uid(),calibrationDate:"",certNo:""});
const newRangeRow=()=>({id:uid(),nominalValue:"",measuredValue:"",timeInterval:"",adjustment:"",tolerance:"",uncertainty:"",duration:"",frequency:"",environment:""});
const newRange=(label,sr)=>({id:uid(),label,quantity:"V",prefix:"",decimals:4,tolPrefix:"",tolDecimals:4,uncPrefix:"",uncDecimals:4,rows:sr.map(()=>newRangeRow())});

// ── DatePicker ────────────────────────────────────────────────────────────────
function DatePicker({value,onChange,placeholder,inputStyle}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({top:0,left:0});
  const[vy,setVy]=useState(new Date().getFullYear());
  const[vm,setVm]=useState(new Date().getMonth());
  const ref=useRef(null);
  const inpRef=useRef(null);
  const parsed=parseDMY(value);
  const today=new Date();

  useEffect(()=>{
    const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",fn);
    return()=>document.removeEventListener("mousedown",fn);
  },[]);

  function openCal(){
    if(inpRef.current){
      const r=inpRef.current.getBoundingClientRect();
      const top=window.innerHeight-r.bottom>260?r.bottom+2:r.top-264;
      setPos({top,left:Math.min(r.left,window.innerWidth-234)});
    }
    setOpen(o=>!o);
  }

  const dim=(y,m)=>new Date(y,m+1,0).getDate();
  const fd=(y,m)=>new Date(y,m,1).getDay();
  const prev=()=>{if(vm===0){setVm(11);setVy(y=>y-1)}else setVm(m=>m-1)};
  const next=()=>{if(vm===11){setVm(0);setVy(y=>y+1)}else setVm(m=>m+1)};
  const selDay=d=>{onChange(fmtDMY(new Date(vy,vm,d)));setOpen(false)};

  const cells=[];
  for(let i=0;i<fd(vy,vm);i++)cells.push(null);
  for(let d=1;d<=dim(vy,vm);d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  const isSel=d=>parsed&&d&&parsed.getFullYear()===vy&&parsed.getMonth()===vm&&parsed.getDate()===d;
  const isTod=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;

  return h("div",{ref,style:{position:"relative",display:"inline-block",width:"100%"}},
    h("div",{style:{display:"flex",alignItems:"center",width:"100%"}},
      h("input",{ref:inpRef,readOnly:true,value:value||"",placeholder:placeholder||"DD/MM/YYYY",
        onClick:openCal,
        style:{...(inputStyle||{}),cursor:"pointer",paddingRight:22,width:"100%",border:"none",background:"transparent",fontSize:12,textAlign:"center",outline:"none",color:"#0f172a",padding:"2px 0"}}),
      h("span",{onClick:openCal,style:{position:"absolute",right:2,cursor:"pointer",fontSize:12,color:"#64748b",pointerEvents:"none"}},"📅")
    ),
    open&&h("div",{style:{position:"fixed",top:pos.top,left:pos.left,zIndex:99999,background:"#fff",border:"1px solid #cbd5e1",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,.22)",padding:10,minWidth:224}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        h("button",{onClick:prev,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"‹"),
        h("span",{style:{fontWeight:700,fontSize:12,color:"#0f172a"}},MONTHS[vm]+" "+vy),
        h("button",{onClick:next,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"›")
      ),
      h("div",{style:{display:"flex",justifyContent:"center",gap:3,marginBottom:8}},
        [vy-2,vy-1,vy,vy+1,vy+2].map(y=>h("button",{key:y,onClick:()=>setVy(y),style:{fontSize:10,padding:"2px 5px",border:"1px solid",borderColor:y===vy?"#2563eb":"#e2e8f0",borderRadius:4,background:y===vy?"#2563eb":"#fff",color:y===vy?"#fff":"#475569",cursor:"pointer",fontWeight:y===vy?700:400}},y))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}},
        WDAYS.map(d=>h("div",{key:d,style:{textAlign:"center",fontSize:10,fontWeight:700,color:"#94a3b8"}},d))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}},
        cells.map((d,i)=>h("button",{key:i,onClick:()=>d&&selDay(d),style:{textAlign:"center",fontSize:11,padding:"4px 2px",border:"none",borderRadius:5,cursor:d?"pointer":"default",background:isSel(d)?"#2563eb":isTod(d)?"#eff6ff":"transparent",color:!d?"transparent":isSel(d)?"#fff":isTod(d)?"#2563eb":"#334155",fontWeight:isSel(d)||isTod(d)?700:400}},d||""))
      ),
      h("div",{style:{marginTop:8,textAlign:"center"}},
        h("button",{onClick:()=>{const t=new Date();setVy(t.getFullYear());setVm(t.getMonth());selDay(t.getDate())},style:{fontSize:11,color:"#2563eb",background:"none",border:"none",cursor:"pointer",fontWeight:600}},"Today"),
        h("button",{onClick:()=>{onChange("");setOpen(false)},style:{fontSize:11,color:"#94a3b8",background:"none",border:"none",cursor:"pointer",marginLeft:10}},"Clear")
      )
    )
  );
}

// ── Report builder ────────────────────────────────────────────────────────────
function buildReport(p){
  const{equipmentId,manufacturer,model,equipmentType,sharedRows,ranges,allRangesCalc,rangePassStatus,globalAllPass,preparedBy,orgName,reportDate}=p;
  const certRows=sharedRows.map((sr,i)=>`<tr style="background:${i===0?"#fffbeb":i%2===0?"#fff":"#f9fafb"}"><td style="padding:5px 10px;border:1px solid #ddd;font-weight:700;color:${i===0?"#92400e":"#333"}">${i===0?"REF":i}</td><td style="padding:5px 10px;border:1px solid #ddd">${sr.calibrationDate||"\u2014"}</td><td style="padding:5px 10px;border:1px solid #ddd">${sr.certNo||"\u2014"}</td><td style="padding:5px 10px;border:1px solid #ddd;color:#555;font-style:italic">${i===0?"Reference year \u2013 base for comparison":"Comparison "+i+": vs row "+(i-1)}</td></tr>`).join("");
  const rangeSummary=ranges.map((rng,ri)=>{const s=rangePassStatus[ri],c=s==="pass"?"#16a34a":s==="fail"?"#dc2626":"#999";return`<tr><td style="padding:6px 10px;border:1px solid #ddd;font-weight:600">${rng.label} [${unitOf(rng)}]</td><td style="padding:6px 10px;border:1px solid #ddd;text-align:center;font-weight:800;color:${c}">${s==="pass"?"\u2713 PASS":s==="fail"?"\u2717 FAIL":"\u2014"}</td></tr>`}).join("");
  const verdict=globalAllPass
    ?`<div style="background:#f0fdf4;border:2px solid #16a34a;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#16a34a;margin-bottom:8px">\u2713 CONCLUSION: Calibration Interval Extension APPROVED</div><p style="font-size:12px;color:#166534;line-height:1.7;margin-bottom:6px">All measurement ranges demonstrated stable performance. All six decision criteria were satisfied for every range and every comparison period.</p><p style="font-size:12px;color:#166534;font-weight:700">Equipment ID: <u>${equipmentId||"N/A"}</u> \u2014 calibration interval may be extended by one (1) additional year.</p></div>`
    :`<div style="background:#fef2f2;border:2px solid #dc2626;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#dc2626;margin-bottom:8px">\u2717 CONCLUSION: Calibration Interval Extension NOT APPROVED</div><p style="font-size:12px;color:#991b1b;line-height:1.7;margin-bottom:6px">One or more ranges did not satisfy all decision criteria.</p><p style="font-size:12px;color:#991b1b;font-weight:700">Equipment ID: <u>${equipmentId||"N/A"}</u> must be calibrated at the standard interval.</p></div>`;
  const rangeDetails=ranges.map((rng,ri)=>{
    const rCalc=allRangesCalc[ri],status=rangePassStatus[ri],sc=status==="pass"?"#16a34a":"#dc2626",sbg=status==="pass"?"#f0fdf4":"#fef2f2";
    const unit=unitOf(rng),dec=rng.decimals;
    const dataRows=sharedRows.map((shared,i)=>{
      const isRef=i===0,calc=rCalc[i],rrow=rng.rows[i];
      const prevVal=i>0&&rng.rows[i-1].measuredValue!==""?Number(rng.rows[i-1].measuredValue).toFixed(dec):"\u2014";
      const dc=calc.decision==="PASS"?"#16a34a":calc.decision==="FAIL"?"#dc2626":"#999";
      const nomD=rrow.nominalValue!==""&&!isNaN(parseFloat(rrow.nominalValue))?Number(rrow.nominalValue).toFixed(dec)+" "+unit:"\u2014";
      const measD=rrow.measuredValue!==""&&!isNaN(parseFloat(rrow.measuredValue))?Number(rrow.measuredValue).toFixed(dec)+" "+unit:"\u2014";
      const tolD=rrow.tolerance!==""&&!isNaN(parseFloat(rrow.tolerance))?Number(rrow.tolerance).toFixed(rng.tolDecimals)+" "+(rng.tolPrefix||"")+rng.quantity:(rrow.tolerance||"\u2014");
      const uncD=rrow.uncertainty!==""&&!isNaN(parseFloat(rrow.uncertainty))?Number(rrow.uncertainty).toFixed(rng.uncDecimals)+" "+(rng.uncPrefix||"")+rng.quantity:(rrow.uncertainty||"\u2014");
      return`<tr style="background:${isRef?"#fffbeb":i%2===0?"#fff":"#f9fafb"}"><td style="padding:5px 7px;border:1px solid #e2e8f0;font-weight:700;color:${isRef?"#92400e":"#555"}">${isRef?"REF":i}</td><td style="padding:5px 7px;border:1px solid #e2e8f0">${shared.calibrationDate||"\u2014"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${nomD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${measD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right;color:#1e40af;font-style:italic">${isRef?"\u2014":prevVal!=="\u2014"?prevVal+" "+unit:"\u2014"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"\u2014":calc.drift!==null?fmt(calc.drift,dec)+" "+unit:"\u2014"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"\u2014":calc.driftPerYear!==null?fmt(calc.driftPerYear,dec):"\u2014"}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"\u2014":tolD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:right">${isRef?"\u2014":uncD}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:700;color:${calc.tur!==null?(calc.tur>=3?"#16a34a":"#dc2626"):"#999"}">${isRef?"\u2014":fmt(calc.tur,2)}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center">${isRef?"\u2014":rrow.adjustment}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;color:${!isRef&&calc.usageScore>2?"#dc2626":"#16a34a"};font-weight:600">${isRef?"\u2014":(calc.usageScore!==null?calc.usageScore:"\u2014")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;color:${!isRef&&calc.riskScore>2?"#dc2626":"#16a34a"};font-weight:600">${isRef?"\u2014":(calc.riskScore!==null?calc.riskScore:"\u2014")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:700;color:${calc.driftLtUnc==="YES"?"#16a34a":calc.driftLtUnc==="NO"?"#dc2626":"#999"}">${isRef?"\u2014":(calc.driftLtUnc||"\u2014")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0;text-align:center;font-weight:800;color:${dc}">${isRef?"\u2014":(calc.decision||"\u2014")}</td><td style="padding:5px 7px;border:1px solid #e2e8f0">${shared.certNo||"\u2014"}</td></tr>`;
    }).join("");
    const analysis=rCalc.slice(1).map((calc,idx)=>{
      const rn=idx+1,sh=sharedRows[rn];if(!calc.decision)return"";
      if(calc.decision==="PASS")return`<div style="margin-top:6px;padding:8px 12px;background:#f0fdf4;border-left:3px solid #16a34a;border-radius:4px;font-size:11px;line-height:1.7"><strong>Row ${rn} (${sh.calibrationDate||"\u2014"}) \u2014 PASS:</strong> No adj \u00b7 TUR=${fmt(calc.tur,2)}\u22653 \u00b7 Drift OK \u00b7 Env=${calc.env}\u22642 \u00b7 Usage=${calc.usageScore}\u22642 \u00b7 Risk=${calc.riskScore}\u22642</div>`;
      return`<div style="margin-top:6px;padding:8px 12px;background:#fef2f2;border-left:3px solid #dc2626;border-radius:4px;font-size:11px"><strong>Row ${rn} (${sh.calibrationDate||"\u2014"}) \u2014 FAIL:</strong><ul style="margin:4px 0 0 18px;padding:0;line-height:1.8">${calc.failReasons.map(r=>"<li>"+r+"</li>").join("")}</ul></div>`;
    }).join("");
    return`<div style="margin-bottom:28px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:10px 14px;background:${sbg};border:1.5px solid ${sc};border-radius:8px"><h3 style="margin:0;font-size:14px">${rng.label} <span style="font-size:11px;font-weight:400;color:#475569">[${unit}]</span></h3><span style="font-size:13px;font-weight:800;color:${sc}">${status==="pass"?"\u2713 ALL PASS":"\u2717 FAIL"}</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#0f172a;color:#e2e8f0"><th style="padding:6px 7px;border:1px solid #1e293b">#</th><th style="padding:6px 7px;border:1px solid #1e293b">Date</th><th style="padding:6px 7px;border:1px solid #1e293b">Nominal</th><th style="padding:6px 7px;border:1px solid #1e293b">Measured</th><th style="padding:6px 7px;border:1px solid #1e293b">Previous</th><th style="padding:6px 7px;border:1px solid #1e293b">Drift</th><th style="padding:6px 7px;border:1px solid #1e293b">Drift/Yr</th><th style="padding:6px 7px;border:1px solid #1e293b">Tolerance</th><th style="padding:6px 7px;border:1px solid #1e293b">Uncertainty</th><th style="padding:6px 7px;border:1px solid #1e293b">TUR</th><th style="padding:6px 7px;border:1px solid #1e293b">Adj</th><th style="padding:6px 7px;border:1px solid #1e293b">Usage</th><th style="padding:6px 7px;border:1px solid #1e293b">Risk</th><th style="padding:6px 7px;border:1px solid #1e293b">D&lt;U</th><th style="padding:6px 7px;border:1px solid #1e293b">Decision</th><th style="padding:6px 7px;border:1px solid #1e293b">Cert.NO</th></tr></thead><tbody>${dataRows}</tbody></table></div>${analysis?"<div style='margin-top:10px'>"+analysis+"</div>":""}</div>`;
  }).join("");
  return`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Calibration Report \u2013 ${equipmentId||"Equipment"}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#0f172a;background:#fff;font-size:12px}.page{max-width:860px;margin:0 auto;padding:32px 36px}h2{font-size:13px;font-weight:700;border-bottom:2px solid #0f172a;padding-bottom:4px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 12px}.mi label{display:block;font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}.mi span{font-size:12px;font-weight:600}.fml{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}.fml td{padding:4px 8px;border:1px solid #e2e8f0}.fml td:first-child{font-weight:600;background:#f8fafc;width:32%}ul.crit{margin:0;padding:0 0 0 18px;font-size:11px;line-height:1.9;color:#334155}.sig{border:1px solid #e2e8f0;border-radius:8px;padding:16px 20px;margin-top:8px}.sl{border-top:1px solid #334155;margin-top:30px;width:200px;font-size:10px;color:#555;padding-top:4px}.disc{font-size:10px;color:#94a3b8;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:10px;line-height:1.6}@media print{.noprint{display:none!important}.page{padding:16px 20px}}</style></head><body><div class="noprint" style="background:#1e40af;padding:12px 24px;display:flex;align-items:center;justify-content:space-between"><span style="color:#fff;font-weight:700;font-size:14px">Calibration Interval Evaluation Report</span><button onclick="window.print()" style="background:#fff;color:#1e40af;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer">\ud83d\udda8 Print / Save as PDF</button></div><div class="page"><div style="border-bottom:3px solid #0f172a;padding-bottom:14px;margin-bottom:18px"><div style="font-size:20px;font-weight:800">CALIBRATION INTERVAL EVALUATION REPORT</div><div style="font-size:10px;color:#64748b">ISO/IEC 17025:2017 \u00b7 ILAC G24 / OIML D10 \u00b7 JCGM 100 (GUM)</div></div><h2>1. Instrument Identification</h2><div class="mg"><div class="mi"><label>Equipment ID</label><span>${equipmentId||"\u2014"}</span></div><div class="mi"><label>\u05d9\u05e6\u05e8\u05df / Manufacturer</label><span>${manufacturer||"\u2014"}</span></div><div class="mi"><label>\u05d3\u05d2\u05dd / Model</label><span>${model||"\u2014"}</span></div><div class="mi"><label>Equipment Type</label><span>${equipmentType==="mobile"?"Mobile (\u05e6\u05d9\u05d5\u05d3 \u05e0\u05d9\u05d9\u05d3)":"Stationary (\u05e6\u05d9\u05d5\u05d3 \u05e0\u05d9\u05d9\u05d7)"}</span></div><div class="mi"><label>Report Date</label><span>${reportDate}</span></div><div class="mi"><label>Historical Certificates in Analysis</label><span>${sharedRows.length} (1 reference + ${sharedRows.length-1} comparison)</span></div><div class="mi"><label>Prepared By</label><span>${preparedBy||"\u2014"}</span></div><div class="mi"><label>Organization</label><span>${orgName||"\u2014"}</span></div></div><div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:10px 16px;margin:0 0 16px;font-size:11px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">\u2713</span><div><strong style="color:#16a34a">Certificate Exceedances: None reported</strong><br><span style="color:#166534">The operator confirmed no exceedances exist in any calibration certificate evaluated.</span></div></div><h2>2. Calibration Certificates Referenced</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">#</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Date</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Certificate No.</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Role</th></tr></thead><tbody>${certRows}</tbody></table><h2>3. Evaluation Result</h2>${verdict}<table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:10px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Range</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:center">Result</th></tr></thead><tbody>${rangeSummary}</tbody></table><h2>4. Methodology</h2><p style="font-size:11px;color:#334155;line-height:1.7;margin-bottom:10px">Follows <strong>ISO/IEC 17025:2017</strong> (Clauses 6.4.7, 7.6, 7.7, 7.8.6), <strong>ILAC G24/OIML D10</strong>, and <strong>JCGM 100:2008 (GUM)</strong>.</p><table class="fml"><tr><td>Drift</td><td>Measured\u2099 \u2212 Measured\u2099\u208b\u2081</td></tr><tr><td>Drift per Year</td><td>Drift \u00f7 Time Interval</td></tr><tr><td>TUR</td><td>Tolerance \u00f7 Uncertainty</td></tr><tr><td>Usage score</td><td>ROUND((Duration + Frequency) \u00f7 2, 0)</td></tr><tr><td>Risk score</td><td>ROUND((Usage score + Environment) \u00f7 2, 0)</td></tr></table><p style="font-size:11px;font-weight:700;margin:10px 0 5px">FAIL conditions:</p><ul class="crit"><li><strong>ADJUSTMENT = 1</strong></li><li><strong>TUR &lt; 3</strong></li><li><strong>|Drift| &gt; Uncertainty</strong></li><li><strong>Environment &gt; 2</strong></li><li><strong>Usage score &gt; 2</strong></li><li><strong>Risk score &gt; 2</strong></li><li><strong>|Measured \u2212 Nominal| + Uncertainty \u2265 Tolerance</strong> (exceedance)</li></ul><h2>5. Detailed Results by Range</h2>${rangeDetails}<h2>6. Authorization</h2><div class="sig"><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px"><div><div class="sl">Prepared by: ${preparedBy||"________________________"}</div><div style="font-size:10px;color:#555;margin-top:8px">Date: ${reportDate}</div></div><div><div class="sl">Reviewed by: ________________________</div><div style="font-size:10px;color:#555;margin-top:8px">Date: ________________________</div></div></div></div><div class="disc">Generated by Calibration Interval Evaluation System. For inclusion in calibration file (\u05ea\u05d9\u05e7 \u05e6\u05d1\u05d3) and ANAB/ILAC auditor presentation.</div></div></body></html>`;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const[equipmentId,setEquipmentId]=useState("");
  const[manufacturer,setManufacturer]=useState("");
  const[model,setModel]=useState("");
  const[equipmentType,setEquipmentType]=useState("fixed");
  const[sharedRows,setSharedRows]=useState(()=>[newSharedRow(),newSharedRow(),newSharedRow()]);
  const[ranges,setRanges]=useState(()=>[newRange("Range 1",[null,null,null])]);
  const[activeRange,setActiveRange]=useState(0);
  const[showModal,setShowModal]=useState(false);
  const[missingFields,setMissingFields]=useState([]);
  const[preparedBy,setPreparedBy]=useState("");
  const[orgName,setOrgName]=useState("");
  const[reportDate,setReportDate]=useState(()=>new Date().toLocaleDateString("en-GB"));
  const[view,setView]=useState("main");
  const[reportHtml,setReportHtml]=useState("");
  const[hasExceedance,setHasExceedance]=useState(null);

  const envOpts=equipmentType==="mobile"?ENV_MOB:ENV_FIX;
  const range=ranges[activeRange];
  const dec=range.decimals;
  const unit=unitOf(range);

  function syncRangeRows(ns,cr){return cr.map(r=>({...r,rows:ns.map((_,i)=>r.rows[i]||newRangeRow())}))}
  function addSharedRow(){if(sharedRows.length>=6)return;const s=[...sharedRows,newSharedRow()];setSharedRows(s);setRanges(rs=>syncRangeRows(s,rs))}
  function removeSharedRow(idx){if(sharedRows.length<=2||idx===0)return;const s=sharedRows.filter((_,i)=>i!==idx);setSharedRows(s);setRanges(rs=>syncRangeRows(s,rs))}
  function updateShared(idx,field,val){setSharedRows(rs=>rs.map((r,i)=>i===idx?{...r,[field]:val}:r))}
  function updateRangeRow(ri,rowIdx,field,val){
    setRanges(rs=>rs.map((rng,r)=>{
      if(r!==ri)return rng;
      if(rowIdx===0&&(field==="tolerance"||field==="uncertainty"||field==="nominalValue")){
        const cv=rng.rows[0][field];
        return{...rng,rows:rng.rows.map((row,rowi)=>{if(rowi===0)return{...row,[field]:val};if(row[field]===""||row[field]===cv)return{...row,[field]:val};return row})};
      }
      return{...rng,rows:rng.rows.map((row,rowi)=>rowi!==rowIdx?row:{...row,[field]:val})};
    }));
  }
  function updateRange(ri,field,val){setRanges(rs=>rs.map((r,i)=>i!==ri?r:{...r,[field]:val}))}
  function addRange(){const l="Range "+(ranges.length+1);setRanges(rs=>[...rs,newRange(l,sharedRows)]);setActiveRange(ranges.length)}
  function removeRange(idx){if(ranges.length<=1)return;setRanges(rs=>rs.filter((_,i)=>i!==idx));setActiveRange(prev=>Math.min(prev,ranges.length-2))}
  function updateRangeLabel(idx,label){setRanges(rs=>rs.map((r,i)=>i===idx?{...r,label}:r))}

  const calculated=sharedRows.map((_,i)=>calcRow(range.rows[i],i>0?parseFloat(range.rows[i-1].measuredValue):undefined,i===0));
  const allRangesCalc=ranges.map(rng=>sharedRows.map((_,i)=>calcRow(rng.rows[i],i>0?parseFloat(rng.rows[i-1].measuredValue):undefined,i===0)));
  const allCompDecisions=allRangesCalc.flatMap(rc=>rc.slice(1).map(c=>c.decision));
  const hasAnyDecision=allCompDecisions.some(d=>d!==null);
  const globalAllPass=hasAnyDecision&&allCompDecisions.every(d=>d==="PASS");
  const rangePassStatus=allRangesCalc.map(rc=>{const comp=rc.slice(1);if(!comp.some(c=>c.decision!==null))return"incomplete";return comp.every(c=>c.decision==="PASS")?"pass":"fail"});
  // Auto-detected exceedance: any non-REF row where |Measured-Nominal|+Uncertainty >= Tolerance
  const detectedExceedances=[];
  ranges.forEach(rng=>{
    const rc=allRangesCalc[ranges.indexOf(rng)];
    rng.rows.forEach((row,i)=>{
      if(i===0)return; // REF has no data
      if(rc[i].exceedOk===false){
        detectedExceedances.push({range:rng.label,row:i,cert:sharedRows[i].certNo||("row "+i)});
      }
    });
  });
  const hasDetectedExceedance=detectedExceedances.length>0;

  function validate(){
    const miss=[];
    if(!equipmentId.trim())miss.push("Equipment ID");
    if(!manufacturer.trim())miss.push("\u05d9\u05e6\u05e8\u05df (Manufacturer)");
    if(!model.trim())miss.push("\u05d3\u05d2\u05dd (Model)");
    sharedRows.forEach((sr,i)=>{
      const rl=i===0?"REF":"\u05e9\u05d5\u05e8\u05d4 "+i;
      if(!sr.calibrationDate)miss.push("Calibration Date ("+rl+")");
      if(!sr.certNo)miss.push("Cert.NO ("+rl+")");
    });
    ranges.forEach(rng=>{
      sharedRows.forEach((_,i)=>{
        if(i===0)return;
        const r=rng.rows[i];
        const rl='Range "'+rng.label+'" \u05e9\u05d5\u05e8\u05d4 '+i;
        if(!r.nominalValue)miss.push("Nominal Value ("+rl+")");
        if(!r.measuredValue)miss.push("Measured Value ("+rl+")");
        if(!r.timeInterval)miss.push("Time Interval ("+rl+")");
        if(r.adjustment==="")miss.push("Adjustment ("+rl+")");
        if(!r.tolerance)miss.push("Tolerance ("+rl+")");
        if(!r.uncertainty)miss.push("Uncertainty ("+rl+")");
        if(!r.duration)miss.push("Duration ("+rl+")");
        if(!r.frequency)miss.push("Frequency ("+rl+")");
        if(!r.environment)miss.push("Environment ("+rl+")");
      });
    });
    return miss;
  }

  function generateAndShow(){
    if(hasDetectedExceedance){return;} // auto-detected exceedance blocks report
    const miss=validate();
    if(miss.length>0){setMissingFields(miss);return;}
    setMissingFields([]);
    const html=buildReport({equipmentId,manufacturer,model,equipmentType,sharedRows,ranges,allRangesCalc,rangePassStatus,globalAllPass,preparedBy,orgName,reportDate});
    setReportHtml(html);setShowModal(false);setView("report");
  }
  function downloadHtml(){
    const blob=new Blob([reportHtml],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="CalibrationReport_"+(equipmentId||"Equipment")+".html";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  }

  // Lock if: not answered, answered "yes", OR auto-detected exceedance
  // Input lock: only when not answered or customer said "yes"
  const locked=hasExceedance!=="no";
  // Report lock: also when an exceedance is auto-detected in the data
  const reportBlocked=locked||hasDetectedExceedance;
  const sc=s=>s==="pass"?PASS_GREEN:s==="fail"?FAIL_RED:"#94a3b8";
  const sl=s=>s==="pass"?"PASS":s==="fail"?"FAIL":"\u2014";
  const cSel={border:"1px solid #cbd5e1",borderRadius:6,padding:"4px 6px",fontSize:12,background:"#fff",color:"#0f172a",cursor:"pointer"};
  const thB=(red)=>({padding:"7px 8px",fontSize:11,fontWeight:700,textAlign:"center",background:"#0f172a",color:red?"#ff6b6b":"#e2e8f0",border:"1px solid #1e293b",whiteSpace:"nowrap",verticalAlign:"bottom"});
  const tdA={padding:"5px 6px",background:AUTO_BG,border:"1px solid #e2e8f0",textAlign:"center",fontSize:12,color:"#334155"};
  const tdI={padding:"3px 4px",background:INPUT_BG,border:"1px solid #fca5a5",textAlign:"center"};
  const tdR={padding:"3px 4px",background:REF_BG,border:"1px solid "+REF_BORDER,textAlign:"center"};
  const inp={width:"100%",border:"none",background:"transparent",fontSize:12,textAlign:"center",outline:"none",color:"#0f172a",padding:"2px 0"};
  const sel={width:"100%",border:"none",background:"transparent",fontSize:11,textAlign:"center",outline:"none",color:"#0f172a"};

  if(view==="report")return h("div",{style:{fontFamily:"'Segoe UI',Arial,sans-serif",minHeight:"100vh",background:"#f1f5f9"}},
    h("div",{style:{background:"#1e40af",padding:"12px 20px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}},
      h("button",{onClick:()=>setView("main"),style:{background:"#fff",color:"#1e40af",border:"none",borderRadius:7,padding:"7px 16px",fontWeight:700,fontSize:12,cursor:"pointer"}},"\u2190 Back"),
      h("span",{style:{color:"#fff",fontWeight:700,fontSize:14}},"Report \u2013 "+(equipmentId||"Equipment")),
      h("div",{style:{marginLeft:"auto",display:"flex",gap:8}},
        h("button",{onClick:downloadHtml,style:{background:"#fff",color:"#1e40af",border:"none",borderRadius:7,padding:"7px 16px",fontWeight:700,fontSize:12,cursor:"pointer"}},"\u2b07 Download HTML"),
        h("button",{onClick:()=>document.getElementById("rframe").contentWindow.print(),style:{background:"#16a34a",color:"#fff",border:"none",borderRadius:7,padding:"7px 18px",fontWeight:700,fontSize:12,cursor:"pointer"}},"\ud83d\udda8 Print / Save PDF")
      )
    ),
    h("div",{style:{padding:16}},
      h("div",{style:{background:"#fff3cd",border:"1px solid #ffc107",borderRadius:8,padding:"10px 16px",marginBottom:12,fontSize:12,color:"#7d4e00"}},
        "To save as PDF: click Print / Save PDF \u2192 choose ",h("strong",null,"Save as PDF"),"\u2192 Save."
      ),
      h("iframe",{id:"rframe",srcDoc:reportHtml,style:{width:"100%",height:"calc(100vh - 160px)",border:"none",borderRadius:8,boxShadow:"0 2px 8px rgba(0,0,0,.15)"},title:"Report"})
    )
  );

  return h("div",{style:{fontFamily:"'Segoe UI',Arial,sans-serif",direction:"ltr",background:"#f1f5f9",minHeight:"100vh",paddingBottom:60}},

    // Missing fields modal
    missingFields.length>0&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}},
      h("div",{style:{background:"#fff",borderRadius:14,padding:"24px 28px",width:460,maxWidth:"92vw",maxHeight:"80vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.35)"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:12}},
          h("span",{style:{fontSize:22}},"\u26a0\ufe0f"),
          h("div",{style:{fontSize:15,fontWeight:700,color:"#dc2626"}},'\u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05e4\u05d9\u05e7 \u05d3\u05d5"\u05d7 \u2013 \u05e9\u05d3\u05d5\u05ea \u05d7\u05e1\u05e8\u05d9\u05dd')
        ),
        h("div",{style:{fontSize:12,color:"#475569",marginBottom:10}},"\u05d9\u05e9 \u05dc\u05de\u05dc\u05d0 \u05d0\u05ea \u05db\u05dc \u05d4\u05e9\u05d3\u05d5\u05ea \u05d4\u05d1\u05d0\u05d9\u05dd:"),
        h("div",{style:{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:"10px 14px",maxHeight:280,overflowY:"auto"}},
          missingFields.map((f,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #fee2e2",fontSize:13,color:"#7f1d1d"}},
            h("span",{style:{color:"#dc2626",fontWeight:700}},"\u2717"),
            h("span",null,f)
          ))
        ),
        h("div",{style:{marginTop:6,fontSize:11,color:"#94a3b8"}},missingFields.length+" \u05e9\u05d3\u05d5\u05ea \u05d7\u05e1\u05e8\u05d9\u05dd"),
        h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:16}},
          h("button",{onClick:()=>setMissingFields([]),style:{padding:"8px 22px",border:"none",borderRadius:8,background:"#0f172a",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"\u05d4\u05d1\u05e0\u05ea\u05d9 \u2013 \u05d7\u05d6\u05d5\u05e8 \u05dc\u05d8\u05d5\u05e4\u05e1")
        )
      )
    ),

    // Report modal
    showModal&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center"}},
      h("div",{style:{background:"#fff",borderRadius:14,padding:"28px 32px",width:420,boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
        h("h3",{style:{margin:"0 0 14px",fontSize:16}},"Generate PDF Report"),
        h("p",{style:{fontSize:12,color:"#64748b",margin:"0 0 16px",lineHeight:1.6}},"Formatted for ANAB/ILAC auditors."),
        h("div",{style:{marginBottom:12}},
          h("label",{style:{fontSize:12,fontWeight:600,color:"#334155",display:"block",marginBottom:4}},"Report Date"),
          h(DatePicker,{value:reportDate,onChange:setReportDate,placeholder:"DD/MM/YYYY",inputStyle:{width:"100%",border:"1px solid #cbd5e1",borderRadius:6,padding:"7px 10px",fontSize:12,background:"#fff",color:"#0f172a"}})
        ),
        [["Prepared By",preparedBy,setPreparedBy,"Name / ID"],["Organization / Laboratory",orgName,setOrgName,"Lab or company name"]].map(function(arr){
          return h("div",{key:arr[0],style:{marginBottom:12}},
            h("label",{style:{fontSize:12,fontWeight:600,color:"#334155",display:"block",marginBottom:4}},arr[0]),
            h("input",{value:arr[1],onChange:function(e){arr[2](e.target.value)},placeholder:arr[3],style:{width:"100%",border:"1px solid #cbd5e1",borderRadius:6,padding:"7px 10px",fontSize:12}})
          );
        }),
        h("div",{style:{display:"flex",gap:10,justifyContent:"flex-end",marginTop:20}},
          h("button",{onClick:()=>setShowModal(false),style:{padding:"8px 18px",border:"1px solid #cbd5e1",borderRadius:8,background:"#fff",color:"#475569",fontSize:13,cursor:"pointer"}},"Cancel"),
          h("button",{onClick:generateAndShow,style:{padding:"8px 20px",border:"none",borderRadius:8,background:"#0f172a",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"Preview Report \u2192")
        )
      )
    ),

    // Header
    h("div",{style:{background:"#0f172a",color:"#fff",padding:"16px 28px",display:"flex",alignItems:"center",justifyContent:"space-between"}},

                  ),
                  h("td",{style:{...tdA,color:"#1e40af",fontStyle:"italic",fontSize:11}},isRef?"\u2014":prevVal!==""?prevVal+" "+unit:"\u2014"),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":h("input",{style:inp,type:"number",step:"0.01",value:rrow.timeInterval,onChange:e=>updateRangeRow(activeRange,i,"timeInterval",e.target.value)})),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":h("select",{style:sel,value:rrow.adjustment,onChange:e=>updateRangeRow(activeRange,i,"adjustment",e.target.value)},h("option",{value:""},"\u2014"),h("option",{value:"0"},"0"),h("option",{value:"1"},"1"))),
                  h("td",{style:{...tdA,color:driftCol}},isRef?"\u2014":calc.drift!==null?fmt(calc.drift,dec):"\u2014"),
                  h("td",{style:tdA},isRef?"\u2014":calc.driftPerYear!==null?fmt(calc.driftPerYear,dec):"\u2014"),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":
                    h("div",null,
                      h("div",{style:{display:"flex",alignItems:"center"}},
                        h("input",{style:{...inp,flex:1},type:"number",step:"any",value:rrow.tolerance,onChange:e=>updateRangeRow(activeRange,i,"tolerance",e.target.value),placeholder:"0."+"0".repeat(range.tolDecimals)}),
                        h("span",{style:{fontSize:9,color:"#7c3aed",whiteSpace:"nowrap",paddingRight:2,fontWeight:700}},(range.tolPrefix||"")+range.quantity)
                      ),
                      rrow.tolerance!==""&&!isNaN(parseFloat(rrow.tolerance))&&h("div",{style:{fontSize:10,color:"#7c3aed",textAlign:"right",paddingRight:2,fontWeight:600}},Number(rrow.tolerance).toFixed(range.tolDecimals)+" "+(range.tolPrefix||"")+range.quantity)
                    )
                  ),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":
                    h("div",null,
                      h("div",{style:{display:"flex",alignItems:"center"}},
                        h("input",{style:{...inp,flex:1},type:"number",step:"any",value:rrow.uncertainty,onChange:e=>updateRangeRow(activeRange,i,"uncertainty",e.target.value),placeholder:"0."+"0".repeat(range.uncDecimals)}),
                        h("span",{style:{fontSize:9,color:"#b45309",whiteSpace:"nowrap",paddingRight:2,fontWeight:700}},(range.uncPrefix||"")+range.quantity)

                    )

                  h("td",{style:{...tdA,color:isRef?"#94a3b8":turCol,fontWeight:isRef?400:700}},isRef?"\u2014":fmt(calc.tur,2)),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":h("select",{style:sel,value:rrow.duration,onChange:e=>updateRangeRow(activeRange,i,"duration",e.target.value)},h("option",{value:""},"\u2014 \u05d1\u05d7\u05e8 \u2014"),...DUR_OPTS.map(o=>h("option",{key:o.v,value:o.v},o.label)))),
                  h("td",{style:isRef?{...tdA,background:"#fef9c3",color:"#94a3b8"}:tdI},isRef?"\u2014":h("select",{style:sel,value:rrow.frequency,onChange:e=>updateRangeRow(activeRange,i,"frequency",e.target.value)},h("option",{value:""},"\u2014 \u05d1\u05d7\u05e8 \u2014"),...FRQ_OPTS.map(o=>h("option",{key:o.v,value:o.v},o.label)))),

                  h("td",{style:{...tdA,color:isRef?"#94a3b8":calc.usageScore!==null&&calc.usageScore>2?FAIL_RED:PASS_GREEN,fontWeight:isRef?400:600}},isRef?"\u2014":calc.usageScore!==null?calc.usageScore:"\u2014"),
                  h("td",{style:{...tdA,color:isRef?"#94a3b8":calc.riskScore!==null&&calc.riskScore>2?FAIL_RED:PASS_GREEN,fontWeight:isRef?400:600}},isRef?"\u2014":calc.riskScore!==null?calc.riskScore:"\u2014"),
                  h("td",{style:{...tdA,color:isRef?"#94a3b8":dltCol,fontWeight:isRef?400:700}},isRef?"\u2014":calc.driftLtUnc||"\u2014"),
                  h("td",{style:{...tdA,fontWeight:800,fontSize:12,color:isRef?"#94a3b8":calc.exceedOk===false?FAIL_RED:calc.exceedOk===true?PASS_GREEN:"#94a3b8",background:(!isRef&&calc.exceedOk===false)?"#fee2e2":undefined}},
                    isRef?"\u2014":calc.exceedOk===null?"\u2014":calc.exceedOk?"OK":"\u2717"
                  ),
                  h("td",{style:{...tdA,color:isRef?"#94a3b8":decCol,fontWeight:800,fontSize:13}},isRef?"\u2014":calc.decision||"\u2014"),
                  h("td",{style:isRef?tdR:tdI},h("input",{style:{...inp,minWidth:80},value:shared.certNo,onChange:e=>updateShared(i,"certNo",e.target.value),placeholder:"Cert #"})),
                  h("td",{style:{...tdA,padding:"4px"}},!isRef&&sharedRows.length>2&&h("button",{onClick:()=>removeSharedRow(i),style:{background:"transparent",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:14}},"\u2715"))
                );
              })
            )
          )
        ),

        // Bottom verdict
        hasAnyDecision&&h("div",{style:{marginTop:16,borderRadius:10,padding:"14px 18px",background:globalAllPass?"#f0fdf4":"#fef2f2",border:"2px solid "+(globalAllPass?"#86efac":"#fca5a5")}},
          h("div",{style:{fontSize:15,fontWeight:800,color:globalAllPass?PASS_GREEN:FAIL_RED,marginBottom:8}},globalAllPass?"\u2713 Extension approved \u2013 Calibration interval may be extended by one additional year":"\u2717 Extension not approved \u2013 Calibration required at standard interval"),
          h("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
            ranges.map((rng,ri)=>h("div",{key:rng.id,onClick:()=>setActiveRange(ri),style:{padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",background:rangePassStatus[ri]==="pass"?"#dcfce7":rangePassStatus[ri]==="fail"?"#fee2e2":"#f1f5f9",color:sc(rangePassStatus[ri]),border:"1px solid "+(rangePassStatus[ri]==="pass"?"#86efac":rangePassStatus[ri]==="fail"?"#fca5a5":"#e2e8f0")}},rng.label+" ["+unitOf(rng)+"]: "+sl(rangePassStatus[ri])))
          )
        ),

        // Reference tables
        h("div",{style:{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
          h("div",{style:{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 16px"}},
            h("div",{style:{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:10,borderBottom:"1px solid #e2e8f0",paddingBottom:6}},"Formulas"),
            [["Drift","Measured Value \u2212 Previous Value"],["Drift per Year","Drift \u00f7 Time Interval"],["TUR","Tolerance \u00f7 Uncertainty"],["Usage score (1-5)","(Duration + Frequency) \u00f7 2 [rounded]"],["Risk score (1-5)","(Usage score + Environment) \u00f7 2 [rounded]"]].map(function(kv){return h("div",{key:kv[0],style:{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #f8fafc",fontSize:11}},h("span",{style:{fontWeight:600,color:"#334155"}},kv[0]),h("span",{style:{color:"#64748b",fontFamily:"monospace"}},kv[1]))})

          )

        h("div",{style:{marginTop:12,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"12px 16px",fontSize:11,color:"#64748b"}},
          h("strong",{style:{color:"#0f172a"}},"Methodological Basis \u00b7 "),
          "ISO/IEC 17025:2017 (Clauses 6.4.7, 7.6, 7.7, 7.8.6) \u00b7 ILAC G24 / OIML D10 \u00b7 JCGM 100 (GUM)",
