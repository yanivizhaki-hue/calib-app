// V6.4: PROTOTYPE_MODE — set to false for the future automated/production pipeline

function rnd(v,d=0){return Math.round(v*Math.pow(10,d))/Math.pow(10,d)}
function fmt(v,d=4){if(v===null||v===undefined||isNaN(v))return"\u2014";return Number(v).toFixed(d)}
function unitOf(range){return (range.prefix||"")+(range.quantity||"V")}
function parseDMY(s){if(!s)return null;const p=s.split("/");if(p.length!==3)return null;const d=+p[0],mo=+p[1]-1,y=+p[2];if(isNaN(d)||isNaN(mo)||isNaN(y))return null;return new Date(y,mo,d)}

// ── VER 2.22: PDF text extraction + SII certificate identity parser ──────────
async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error("pdf.js not loaded");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf, disableWorker:true, isEvalSupported:false}).promise;
  let text="";
  const nPages=Math.min(pdf.numPages,2);
  for(let i=1;i<=nPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const items=content.items.map(it=>({s:it.str,x:it.transform[4],y:Math.round(it.transform[5])}));
    const byLine={};
    items.forEach(it=>{(byLine[it.y]=byLine[it.y]||[]).push(it)});
    Object.keys(byLine).sort((a,b)=>b-a).forEach(y=>{
      const line=byLine[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ");
      text+=line+"\n";
    });
  }
  return text;
}

function parseSiiIdentity(txt){
  // VER 2.23: hardened for 9 SII formats — clean() handles ---, N/A, "See on page", short serials
  const out={certNo:null,sn:null,customerNo:null,manufacturer:null,model:null,calDate:null,inventoryNo:null};
  // clean(): treat ---, N/A, "See on page...", dash-only as empty
  const clean=v=>{if(!v)return null;v=v.trim();if(/^-+$/.test(v))return null;if(/^(n\/?a|na)$/i.test(v))return null;if(/^see\b/i.test(v))return null;return v;};
  let m;
  m=txt.match(/CERTIFICATE\s+NO\.?\s+(\d{6,})/i); if(m)out.certNo=m[1];
  m=txt.match(/CUSTOMER\s+No\.?\s*:?\s*([A-Za-z0-9][A-Za-z0-9\-\/]*)/i); if(m)out.customerNo=clean(m[1]);
  // Serial: match "S/N", "S.N", "SN", or the full word "Serial (Number/No)".
  // Allow an optional letter-group + space in the value (e.g. "CM 180026").
  // V5.9.12: the SII certificate is bilingual — the value is followed by " : <Hebrew label>".
  // The lookahead must stop the value at a single " :" or any Hebrew character, not only
  // at 2+ spaces, otherwise "CM 180026 : \u05de\u05e1' \u05e1\u05d9\u05d3\u05d5\u05e8\u05d9" fails to match and the serial is lost.
  m=txt.match(/(?:S\s*[\.\/]?\s*N|SERIAL\s*(?:NUMBER|NO\.?)?)\s*[\.\/]?\s*:?\s*([A-Za-z0-9][A-Za-z0-9\-\/\s]*?)(?=\s{2,}|\s*:|\n|$|CUSTOMER|MANUFACTURER|MODEL|CERTIFICATE|[\u0590-\u05FF])/i); if(m)out.sn=clean(m[1]);
  m=txt.match(/MANUFACTURER\s*:?\s*([A-Za-z][A-Za-z0-9\-\.\s]*?)\s*(?::|\s{2,}|\n|MODEL|$)/i); if(m)out.manufacturer=clean(m[1]);
  m=txt.match(/MODEL\s*:?\s*([A-Za-z0-9][A-Za-z0-9\-\/]*)/i); if(m)out.model=clean(m[1]);
  m=txt.match(/CAL\.?\s*DATE\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i); if(m)out.calDate=m[1];
  // If no valid serial: inventory/asset number becomes the identifier
  if(!out.sn){m=txt.match(/(?:INVENTORY|ASSET|INV)\.?\s*(?:No\.?)?\s*:?\s*([A-Za-z0-9][A-Za-z0-9\-\/]{2,})/i);if(m)out.inventoryNo=clean(m[1]);}
  return out;
}

function reconcileIdentities(list){
  if(!list.length) return {ok:false,error:"\u05dc\u05d0 \u05d4\u05d5\u05e2\u05dc\u05d5 \u05ea\u05e2\u05d5\u05d3\u05d5\u05ea"};
  const norm=v=>(v==null?"":String(v).trim().toUpperCase());
  const allHaveSN=list.every(x=>x.sn);
  const key=allHaveSN?"sn":(list.every(x=>x.inventoryNo)?"inventoryNo":(list.every(x=>x.customerNo)?"customerNo":null));
  if(!key) return {ok:false,error:"\u05dc\u05d0 \u05e0\u05de\u05e6\u05d0 \u05de\u05e1\u05e4\u05e8 \u05de\u05d6\u05d4\u05d4 (\u05e1\u05d9\u05e8\u05d9\u05d0\u05dc\u05d9/\u05d0\u05d9\u05e0\u05d5\u05d5\u05e0\u05d8\u05e8\u05d9) \u05d1\u05db\u05dc \u05d4\u05ea\u05e2\u05d5\u05d3\u05d5\u05ea"};
  const keyVals=[...new Set(list.map(x=>norm(x[key])))];
  if(keyVals.length>1) return {ok:false,error:"\u05de\u05e1\u05e4\u05e8 \u05de\u05d6\u05d4\u05d4 \u05e9\u05d5\u05e0\u05d4 \u05d1\u05d9\u05df \u05d4\u05ea\u05e2\u05d5\u05d3\u05d5\u05ea ("+key+"): "+keyVals.join(" \u00b7 ")+" \u2013 \u05d9\u05e9 \u05dc\u05d4\u05e2\u05dc\u05d5\u05ea \u05ea\u05e2\u05d5\u05d3\u05d5\u05ea \u05e9\u05dc \u05d0\u05d5\u05ea\u05d5 \u05de\u05db\u05e9\u05d9\u05e8"};
  const mans=[...new Set(list.map(x=>norm(x.manufacturer)).filter(Boolean))];
  const mods=[...new Set(list.map(x=>norm(x.model)).filter(Boolean))];
  if(mans.length>1) return {ok:false,error:"\u05d9\u05e6\u05e8\u05df \u05e9\u05d5\u05e0\u05d4 \u05d1\u05d9\u05df \u05d4\u05ea\u05e2\u05d5\u05d3\u05d5\u05ea: "+mans.join(" \u00b7 ")};
  if(mods.length>1) return {ok:false,error:"\u05d3\u05d2\u05dd \u05e9\u05d5\u05e0\u05d4 \u05d1\u05d9\u05df \u05d4\u05ea\u05e2\u05d5\u05d3\u05d5\u05ea: "+mods.join(" \u00b7 ")};
  const withDates=list.map(x=>({...x,_d:parseDMY(x.calDate)}));
  if(withDates.some(x=>!x._d)) return {ok:false,error:"\u05d1\u05d0\u05d7\u05ea \u05d4\u05ea\u05e2\u05d5\u05d3\u05d5\u05ea \u05d7\u05e1\u05e8 \u05ea\u05d0\u05e8\u05d9\u05da \u05db\u05d9\u05d5\u05dc \u05ea\u05e7\u05d9\u05df"};
  withDates.sort((a,b)=>a._d-b._d);
  // V5.9.11 — RULE 2: when the instrument identity is established by SERIAL (or inventory),
  // the customer number is secondary. If the customer numbers DIFFER across certificates,
  // do NOT fill Customer No (leave it blank) and flag a non-blocking note. The process
  // continues, because the identical serial already proves it is the same instrument.
  const custVals=[...new Set(list.map(x=>norm(x.customerNo)).filter(Boolean))];
  const customerNoConflict=(key!=="customerNo")&&(custVals.length>1);
  return {ok:true, key, identity:{
    // V5.9.9: numbers NEVER cross fields. Serial gets a real serial (or an
    // inventory/asset number when no serial exists — that is a legitimate
    // equipment identifier). A CUSTOMER number is NEVER placed into the serial
    // field: it stays in Customer No, and the "required" obligation shifts to it.
    serialNumber:allHaveSN?list[0].sn:(key==="inventoryNo"?list.find(x=>x.inventoryNo).inventoryNo:""),
    // RULE 2: if customer numbers differ (and identity is by serial/inventory), leave blank.
    customerNo:customerNoConflict?"":(list[0].customerNo||""),
    manufacturer:list[0].manufacturer||"",
    model:list[0].model||"",
    // true only when an inventory/asset number stands in for a missing serial.
    usedInventoryAsSerial:!allHaveSN&&key==="inventoryNo",
    // true when there is no serial and no inventory: the customer number is the
    // sole unique identifier, so the required-field obligation moves to Customer No.
    serialOptional:!allHaveSN&&key==="customerNo",
    // RULE 2 flag: customer numbers differed across certificates (non-blocking note).
    customerNoConflict:customerNoConflict
  }, sorted:withDates};
}

// ══════════════════════════════════════════════════════════════════════════
// AI PROTOTYPE V1.0 — Full measurement extraction via Claude API
// ══════════════════════════════════════════════════════════════════════════

// The metrological rules (taught by the user) encoded as the extraction contract.
const AI_SYSTEM_PROMPT = `You are a metrology data-extraction engine for calibration certificates from ANY laboratory, ANY format, ANY language (Hebrew, English, German, etc.). You read certificates the way an expert metrologist does - you understand content, not fixed layouts.

YOU RECEIVE MULTIPLE CERTIFICATES OF THE SAME INSTRUMENT, in chronological order (oldest first). Your job: (a) run the checks below on EACH certificate, and (b) pick the risk point per technology FROM THE OLDEST certificate, then TRACK THAT SAME physical point (same sub-range / same frequency) across ALL the later certificates so drift over time can be computed. YOU do the tracking yourself - match points by their physical identity (e.g. "50 V d.c." is the same point in every certificate) even if wording differs slightly. Never leave a later certificate's value empty when that sub-range exists in it.

CRITICAL — LEGEND vs. RESULTS (read this first):
The LAST page of many certificates is a LEGEND / DECISION-RULE EXPLANATION (e.g. "p = Pass", "cp = Conditional pass", diagrams of guard bands). This page DEFINES what the markers mean and which decision rule is used. USE IT ONLY to (a) identify the decision rule, and (b) learn the meaning of each marker. It is NOT measurement data — NEVER extract readings, ranges, or risk points from the legend page. Measurement results are ONLY in the numeric RESULT TABLES (typically pages 2 onward) that contain columns like Reading / Measured / Lower / Upper / Uncertainty / marker per row.

STEP 0 - DETECT THE DECISION RULE (ILAC-G8:09/2019):
Identify which decision rule the certificate uses (from its marker legend / text):
- "non_binary_guard" : Non-binary with guard band. Markers: p, cp, n/a, fc, f (+ nd/?/#).
- "binary_simple"    : Binary simple acceptance (w=0). Markers: Pass/Fail (or p/f).
- "binary_guard"     : Binary with guard band. Markers: Pass/Fail.
- "shared_risk"      : Shared-risk rule agreed with customer (certificate states the agreement).
- "legacy_c_nc"      : Older ILAC-G8:2009 convention. Markers: C (Compliant), NC (Not Compliant), --- (cannot decide = combination of cp+fc).
Also handle instrument-specific normative rules the certificate may declare (e.g. torque ISO 6789-2, mass OIML R111-1). If declared, follow the compliance column as given. Return it in "decisionRule".

STEP 1 - MARKER / EXCEEDANCE CHECK (UNIVERSAL BLOCKING RULE):
There is a marker/conformity column. Classify each row marker into VALID, NEUTRAL, or BLOCKING.
UNIVERSAL RULE: only VALID and NEUTRAL are allowed. ANY BLOCKING marker (even one) means the whole certificate CANNOT be extended.
Per-rule classification:
- non_binary_guard : VALID={p}       NEUTRAL={nd,?,#}  CONDITIONAL={cp}  BLOCKING={n/a,fc,f}
- binary_simple    : VALID={Pass,p}  NEUTRAL={nd,?,#}  BLOCKING={Fail,f}
- binary_guard     : VALID={Pass,p}  NEUTRAL={nd,?,#}  BLOCKING={Fail,f}
- shared_risk      : follow the agreement on the certificate; compliant=VALID, non-compliant=BLOCKING
- legacy_c_nc      : VALID={C}         NEUTRAL={}        BLOCKING={NC, ---, cannot decide}  (--- means undetermined = FC = exceedance, always blocking)
CONDITIONAL (cp / Conditional Pass) is handled by LOCATION, not as an automatic block:
- Report cp per-certificate via "hasCp":true and list the cp markers in "cpMarkers" for that certificate.
- Do NOT put cp into "exceedanceMarkers" and do NOT set "hasExceedance":true because of cp. cp is NOT a blocking marker here.
- The code decides: cp only in historical certificates (not the latest index) -> allowed; cp in the LATEST certificate -> locks. You (the AI) only classify and report; you do NOT apply the location rule.
Hard stops:
- NO marker/conformity column at all -> "error":"NO_MARKER_COLUMN".
- Not a single VALID marker anywhere -> "error":"NO_VALID_P".
- Any BLOCKING marker present -> "hasExceedance":true and list them in "exceedanceMarkers".

STEP 2 - UNITS & TOLERANCE (CRITICAL - read carefully):
UNIT PER CELL: Each cell may have its OWN unit prefix, and it often DIFFERS within the same row. A very common pattern: Reading/Lower/Upper are in kΩ (or mF, nF...) but the UNCERTAINTY is in Ω (or pF...) only. You MUST read the unit of EACH cell independently.
KEEP THE CERTIFICATE'S OWN UNIT AND RESOLUTION: Do NOT convert to SI base. For each risk point, use the UNIT AND PREFIX OF THE READING CELL as the point's unit (e.g. if reading is "100.2 nF", the point unit is nF and values stay ~100, not 0.0000001 F). Preserve the number of decimals shown on the certificate.
HARMONIZE WITHIN THE POINT: convert any cell that is in a DIFFERENT prefix to the READING's prefix, so all of nominal/reading/lower/upper/tolerance/uncertainty are in the SAME unit and the math works. Example: reading 100.2 nF, uncertainty "800 pF" -> 0.8 nF (because 800 pF = 0.8 nF). Then |reading-nominal|+uncertainty and (upper-lower)/2 are directly comparable, and TUR = tolerance/uncertainty is sensible (never absurdly < 3 due to a unit mismatch).
TOLERANCE:
- Accuracy or Tolerance given directly -> use it (in the reading's unit).
- Upper Limit and Lower Limit given -> Tolerance = (Upper - Lower) / 2.
- %Reading / %F.S. / permissible-error -> convert to an absolute tolerance at that point (in the reading's unit).
PERCENT CELLS (GENERIC — applies to ANY certificate, any format, cell-by-cell). Some certificates print tolerance / uncertainty / error as a PERCENT instead of an absolute value (e.g. force meters "%FS", or "%Reading"/"%Rdg"/"%of Reading" on other instruments). Handle EACH cell on its own — a certificate may mix absolute and percent cells. Your job is to COPY what is printed; the software does ALL conversion and math. For each row's oldest point:
    • If the TOLERANCE / Max-permissible cell is a percent: set "tolPct" = the printed number (absolute magnitude) and "tolPctType" = "FS" (percent of full-scale: %FS, %F.S.) or "RDG" (percent of reading: %Reading, %Rdg, %of Reading). Still ALSO fill absolute "tolerance" if (and only if) an absolute value is ALSO printed; otherwise leave "tolerance" as before and the software will compute it from the percent.
    • If the UNCERTAINTY cell is a percent: set "uncPct" and "uncPctType" ("FS"/"RDG") the same way.
    • If an "Error of the UUT as specified" percent column exists: set "errPct" (absolute magnitude) and "errPctType" ("FS"/"RDG").
    Copy the numbers EXACTLY as printed — do NOT multiply, divide, or convert. Do NOT compute full-scale. Leave every *Pct/*PctType field null for ordinary absolute cells. reading and nominal are always the absolute printed values (R and F).
Report the reading's unit (with prefix) in "quantity" (e.g. "nF", "mF", "kΩ", "V").
SANITY CHECK (MANDATORY — do this for every point before returning it):
Compute TUR = tolerance / uncertainty. A real TUR is almost always between about 1 and 20.
- If TUR comes out ABSURDLY LARGE (e.g. > 100, like 5000) OR absurdly small (e.g. < 0.1), you almost certainly made a UNIT/PREFIX error on the uncertainty or tolerance. STOP and re-read the cell units, convert correctly, and recompute.
PREFIX CONVERSION (metric): p=10^-12, n=10^-9, µ=10^-6, m=10^-3, (none)=1, k=10^3, M=10^6, G=10^9.
To convert a value to the reading's unit, multiply by 10^(sourcePrefixExp - readingPrefixExp).
SPACED PREFIX + UNIT (critical — this exact format has caused errors): SII certificates print the uncertainty cell as THREE space-separated tokens: NUMBER, PREFIX-LETTER, UNIT-LETTER — e.g. "80 p F" means 80 pF (80 picofarad), "800 p F" = 800 pF, "13 µ V" = 13 µV, "5.6 µ V" = 5.6 µV, "40 p S" = 40 pS. The single letter after the number (p / n / µ / m / k / M) is the PREFIX, and the last letter (F / V / S / Ω / A) is the base unit. Do NOT ignore or drop the middle prefix letter, and do NOT read "80 p F" as 80 F or as 0.0001 of anything. Join the three tokens: 80 + p + F = 80 pF. Then convert to the reading's prefix.
COMMON TRAP — pS vs nS: 40 pS = 40 × 10^-12 S = 0.04 × 10^-9 S = 0.04 nS (NOT 0.00004 nS). 800 pF = 0.8 nF. 5.6 µV = 0.0056 mV. Always line up the powers of ten.
WORKED EXAMPLE (the one that failed): CAPACITANCE "10 nF" row, reading unit nF, uncertainty printed "80 p F" = 80 pF. Convert: 80 pF = 80 × 10^-12 F = 0.080 × 10^-9 F = 0.080 nF. So uncertainty = 0.080 nF (NOT 0.0001 nF). With tolerance |10.15-10.00| = 0.15 nF, TUR = 0.15/0.080 ≈ 1.9 — sensible. A TUR of ~1875 means you left the uncertainty in pF or dropped the prefix — recompute. NOTE mixed prefixes appear in the SAME uncertainty column on one certificate (e.g. "80 p F", "800 p F", "8 n F", "80 n F", "68 µ F") — convert EACH independently to its row's reading unit.
SECOND WORKED EXAMPLE (CONDUCTANCE, also failed): "50 nS" row, reading unit nS, uncertainty "40 p S" = 40 pS. Convert: 40 pS = 40 × 10^-12 S = 0.040 × 10^-9 S = 0.040 nS (NOT 0.00004 nS). Tolerance (10.20-9.80)/2 = 0.20 nS, so TUR = 0.20/0.040 = 5.0 — sensible. A TUR of ~5000 means the pico prefix on "40 p S" was dropped — recompute. The pattern "<num> p <UNIT>" ALWAYS means pico; this applies to p S (picosiemens), p F (picofarad), p A (picoamp), p V, p Ω — every one.
MANDATORY PICO CHECK (do this for EVERY row whose uncertainty token sequence is "<number> p <unit>"): the middle letter "p" is pico = 10^-12. Before returning the row, compute TUR = tolerance / uncertainty (both in the reading's unit). If TUR comes out in the hundreds or thousands, you almost certainly failed to convert the pico prefix — go back, convert (pico→reading-prefix), and recompute. A correct SII row essentially never has TUR > ~100. Never return a row where the uncertainty is 1000× or 800× smaller than the tolerance because of an unconverted p.
If after correct conversion TUR is still extreme, keep the correct values anyway (the app will flag it) — but never return a value you got from a prefix you didn't actually convert.

STEP 3 - EXTRACT ALL MEASUREMENT POINTS (you do NOT select the risk point — the software does):
Your job here is ONLY to READ and RETURN every valid measurement point. Do NOT compute risk, do NOT pick the "worst" one, do NOT compare. Just extract.
Definitions:
- A "technology" = a main physical quantity / measurement heading (DC VOLTAGE, AC VOLTAGE, DC CURRENT, AC CURRENT, FREQUENCY, RESISTANCE, CAPACITANCE, TEMPERATURE, MASS...). DC and AC are SEPARATE technologies. For spectrum-type certs the technologies are the test types (FREQUENCY ERROR, ABS LEVEL, RF ATTENUATOR, FLATNESS...).
  ⚠️ CRITICAL DMM RULE — d.c. and a.c. rows are NEVER the same technology, even when they appear close together. Look at the UNIT SUFFIX of each measurement row: rows ending in "d.c." belong to a DC technology; rows ending in "a.c." belong to the matching AC technology. You MUST split them:
    • A row like "3.2 V a.c. @ 50 Hz" or "320 V a.c." belongs to AC VOLTAGE — NEVER put it inside DC VOLTAGE.
    • A row like "32 mA a.c." or "10 A a.c." belongs to AC CURRENT — NEVER put it inside DC CURRENT.
    • Rows "320 mV d.c.", "32 V d.c." → DC VOLTAGE. Rows "32 mA d.c.", "10 A d.c." → DC CURRENT.
    So a DMM certificate that lists both d.c. and a.c. voltage rows yields TWO technologies (DC VOLTAGE and AC VOLTAGE), and likewise DC CURRENT and AC CURRENT are two technologies. A typical DMM = DC VOLTAGE, AC VOLTAGE, DC CURRENT, AC CURRENT, RESISTANCE = 5 technologies. Before returning, RE-CHECK every technology's rows: if any row's unit ends in "a.c." while the technology is a DC one (or vice-versa), MOVE that row into its correct AC/DC technology, creating the technology if it does not yet exist. A single technology object must contain EITHER only d.c. rows OR only a.c. rows, never a mix.
  CRITICAL — a technology is defined by its PHYSICAL QUANTITY, NOT by the unit/prefix. Different sub-ranges of the same technology often use different prefixes, and that does NOT make them separate technologies:
    * "DC VOLTAGE" with sub-ranges 50 mV, 500 mV, 5 V, 50 V, 500 V, 1000 V is ONE technology (even though some rows are in mV and some in V). Do NOT split it into "DC VOLTAGE [mV]" and "DC VOLTAGE [V]".
    * "DC CURRENT" with sub-ranges 50 µA, 5 mA, 10 A is ONE technology (µA/mA/A are just prefixes). Do NOT split into "DC CURRENT [µA]", "DC CURRENT [mA]", "DC CURRENT [A]".
    * "RESISTANCE" spanning Ω, kΩ, MΩ is ONE technology.
  So the number of "technologies" you return = the number of distinct MAIN HEADINGS on the certificate (typically: DC VOLTAGE, AC VOLTAGE, DC CURRENT, AC CURRENT, FREQUENCY, RESISTANCE, CAPACITANCE, TEMPERATURE...), NOT the number of unit variations.
- A "subRange" = a measurement span inside a technology (e.g. "50 µA","500 µA","5 mA" inside DC CURRENT; "100 g","1000 g" inside MASS; "50 mV d.c.","500 mV d.c.","5 V d.c." inside DC VOLTAGE). Sub-ranges can have different prefixes.
  FREQUENCY IS PART OF THE IDENTITY for AC quantities: under one voltage/current range there are often several rows at different frequencies (e.g. "3.2 V a.c." has a 50 Hz row AND a 500 Hz row; "5 V a.c." may have 50 Hz, 40 Hz, 1 kHz, 10 kHz, 20 kHz, 100 kHz). EACH frequency row is a SEPARATE measurement point and MUST be returned as its OWN row with its own subRange label including the frequency (e.g. subRange "3.2 V a.c. @ 50 Hz" and "3.2 V a.c. @ 500 Hz"). NEVER merge different-frequency rows, and never return only one of them — the software compares them all to find the riskiest. Missing a frequency row can hide the true worst-case point.
For the OLDEST certificate, return EVERY technology, and inside it EVERY valid measurement row (marker VALID), grouped by subRange. Include ALL rows — the software needs them all to choose. Skip only rows whose marker is BLOCKING/neutral for selection (but blocking markers were already handled in STEP 1).

=== EXTRACTION MANDATE (highest priority) — return every MEASUREMENT ROW, but ONLY measurement rows ===
A MEASUREMENT ROW is defined STRUCTURALLY: it has a READING value, at least one LIMIT (Lower or Upper), and a marker. Return one row object for every such line in the RESULTS table, going top to bottom. Specifically:
- A row whose READING is 0, 0.0, -0.01, or near zero IS a measurement row — return it. Zero-reading rows are frequently the RISKIEST points; skipping them corrupts the result. NEVER drop a row just because its reading looks small, trivial, or is zero.
- ZERO-NOMINAL ROWS ARE MANDATORY (critical, never skip): a row whose NOMINAL value is 0 / 0.0 / 0.00 mV (the point centered on zero, e.g. the "0.00 mV" line in a DC VOLTAGE range with limits like -0.1 .. 0.1) MUST ALWAYS be returned. These zero-nominal points are usually the single most dangerous point in the technology because the tolerance band around zero is tiny. Do NOT treat a zero nominal as "empty", "blank", "no data", or a separator — it is a real, high-priority measurement row. Scan explicitly for the zero-nominal line in every range that has one and always include it.
  CONCRETE EXAMPLE OF THE TRAP (this is exactly where extraction fails): a "320 mV d.c." range typically has FIVE rows in this order:
      -300.0 mV   (negative)
      -100.0 mV   (negative)
         0.0 mV   (ZERO — in the MIDDLE of the list)  <-- most often skipped by mistake
       100.0 mV   (positive)
       300.0 mV   (positive)
  You MUST return all five, INCLUDING the 0.0 mV row that sits in the middle between the negatives and the positives. Do not "jump over" the middle row.
  SYMMETRIC-RANGE HARD RULE (do this ONLY for symmetric ranges — do NOT waste effort on normal ranges, so no extra time is spent):
  A range is "symmetric" if it contains BOTH negative AND positive nominal values (e.g. -500,-300,-100,...,+100,+300,+500). This applies to EVERY such range regardless of its label — 320 mV, 600 mV, 6 V, or any other symmetric d.c. range. The moment you see one negative and one positive nominal under the same subRange, treat it as symmetric.
  For EVERY symmetric range, do these three steps IN ORDER before moving on:
    STEP 1 — LIST: write out (to yourself) the full ordered list of nominal values you see, e.g. "-500, -300, -100, 0, +100, +300, +500 → 7 rows". A symmetric list is odd-length and ALWAYS has a 0 exactly in the middle. If your list has NO zero in the middle, you skipped it — put it back before counting.
    STEP 2 — SET rowCount to that count and extract EXACTLY that many rows, including the middle 0.0 row with its own limits (for the 600 mV example the zero row is 0.0 mV with limits like -0.2 .. +0.2).
    STEP 3 — VERIFY: the number of row objects you return for this range MUST equal the count from STEP 1. If it is short by one, the missing row is the middle 0.0 — add it now. This is not optional: a symmetric range returned WITHOUT its zero row is a wrong answer.
  For NON-symmetric ranges (all-positive or all-negative), extract normally without this step.
  The zero row is frequently the single most dangerous point; missing it in a symmetric range corrupts the result.
  Never skip a row just because it is in the MIDDLE of a list; middle rows (especially the zero row) are as important as the first and last.
  LABEL-ON-FIRST-ROW TRAP (this is the exact pattern that has caused misses): in SII tables the subRange label (e.g. "500 mV d.c.") is printed ONLY on the FIRST data row of the block; the remaining rows — INCLUDING the middle 0.00 row — carry NO range label, just numbers. Do NOT treat an unlabeled numeric line as a separator, header, or blank. Every numeric line between the labeled first row and the next labeled subRange belongs to the SAME subRange. Worked example — this exact block MUST yield 7 rows:
      500 mV d.c.  -400.00 mV ... 77 µV     <- labeled first row
                   -200.00 mV ... 20 µV
                   -100.00 mV ... 13 µV
                    0.00 mV  -0.02 .. 0.02  7.7 µV   <- THE ZERO ROW — unlabeled, mid-block, MUST be extracted
                    100.00 mV ... 13 µV
                    200.00 mV ... 20 µV
                    400.00 mV ... 77 µV
    If you return 6 rows for this block you dropped the 0.00 row — add it back. The 0.00 row here has the smallest limits (±0.02) and is the most dangerous point in the whole DC VOLTAGE technology.
- A row at a different frequency (50 Hz, 500 Hz, 1 kHz...) is its own measurement row — return each.
- A row with a one-sided "---" limit (one side missing) is still a measurement row — return it.

=== MANDATORY TWO-PASS ZERO VERIFICATION (do this internally BEFORE emitting JSON — it is not a second output, it is a second look) ===
After you have built your full row list (PASS 1), do a dedicated SECOND internal pass whose ONLY job is to find zero-nominal rows that PASS 1 may have skipped. This costs almost no time because you are only re-scanning for one specific thing.
  PASS 2 procedure, per technology:
  1. Look ONLY inside the CALIBRATION RESULTS table. Do NOT pull zeros from headers, identification blocks, footnotes, summary lines, or any non-results area.
  2. A row qualifies as a "symmetric-range zero" ONLY if: its NOMINAL is 0 (0, 0.0, 0.00…) AND within the SAME subRange there are negative nominals on one side and positive nominals on the other (it sits in the MIDDLE, between minus and plus values). 
  3. Do NOT treat as a symmetric-range zero: a 0 that is the first or last row of a one-directional range (e.g. a resistance/current range that simply starts at 0), a stray 0 that appears once with no negative/positive neighbours, or any 0 outside the results table. Those are handled by normal extraction, not by this check.
  4. CROSS-CHECK against your PASS 1 rows: for every symmetric-range zero you just located in PASS 2, confirm it already exists in your PASS 1 row list.
  5. If a symmetric-range zero is MISSING from PASS 1, read its own values (nominal 0, its printed lower/upper limits, its reading, its uncertainty) directly from that line in the results table and ADD it to "rows" now. These values are printed in the certificate — read them; never invent them.
  6. If — after PASS 2 — you still cannot locate or read a zero row that the symmetry implies should exist (e.g. the line is unreadable, cut off, or genuinely absent), DO NOT fabricate it. Instead set "suspectMissingZero": true on that technology so the software can flag it for human review. Only set this when symmetry implies a zero should be there but you could not recover it; otherwise omit it (or false).
The goal: every symmetric range leaves this step with its middle zero present in "rows", OR with suspectMissingZero=true. Never silently drop it.

- Do not summarize, sample, deduplicate, or "pick representative" rows. Return the COMPLETE list of measurement rows. If a technology shows 10 measurement lines, return 10 rows — not 3, not "the important ones", ALL of them.

DO NOT extract numbers that are NOT measurements (ignore these entirely — pulling them in creates junk that breaks the calculation):
- Range / sub-range HEADINGS (e.g. "320 mV d.c.", "32 kΩ", "3.2 V a.c.") are LABELS, not data points. The number inside a heading (320, 32, 3.2) is NOT a reading — use it only as the subRange name.
- The STANDARD INSTRUMENT column is the reference value for the row; do NOT return it as its own separate measurement point.
- Page numbers, dates, certificate numbers, serial numbers, customer numbers.
- Notes, titles, headers, and standard references (e.g. "ISO 6789", "IECEE OD-5014", "TC: K").
- The legend / interpretation page.
STRUCTURAL TEST: a real measurement row has (a reading value) AND (a marker) AND EITHER (at least one Lower/Upper limit) OR (a tolerance / Max-permissible-error value, whether absolute or percent). If it has none of the limit/tolerance forms, it is NOT a measurement row — ignore it. This is how you tell a real data point from a stray number. NOTE: some instruments (e.g. force meters) print NO Lower/Upper columns at all — only reading (R), applied/nominal (F), an error, and a "Max permissible Error" (often in %). Those ARE valid rows: return them with reading, nominal, marker, and the tolerance/percent fields; leave lower/upper null. The software derives the band from the tolerance.
Before finishing, re-scan each technology and confirm the number of rows you output equals the number of printed MEASUREMENT lines (not counting headings/notes). A missing measurement row is a critical failure; an extracted heading/label is also a failure.
COMPLETENESS - CRITICAL: scan ALL pages; never skip a technology/subRange/row that has data (CAPACITANCE/TEMPERATURE are often on later pages).
ONE-SIDED LIMITS ARE VALID — keep these rows: a row may have "---" (a dash) in EITHER the lower OR the upper limit (e.g. a resistance near 0 has no lower bound). That is a legitimate one-sided limit, NOT an invalid row — you MUST return it. Never convert "---" to 0; a dash means "no value". ONLY skip a row when BOTH the lower AND upper limits are "---"/blank (no manufacturer limits at all) — that row cannot be used and should be dropped.
UNIT CARE FOR SUB-RANGES: sub-ranges within one technology may jump units (e.g. CURRENT has "32 mA", "320 mA", and "10 A"). Read each sub-range's own unit exactly. "10 A d.c." is 10 amperes (=10000 mA), NOT 10 mA and NOT 1000 mA. Keep each sub-range's reading in the unit actually printed for that row, and set the technology "quantity" to a consistent unit, harmonizing correctly (10 A -> 10000 mA if the technology unit is mA).

STEP 4 - TRACK EACH POINT ACROSS CERTIFICATES (minimal — reading only for later certs):
The software will pick ONE risk point per technology/subRange from the OLDEST certificate. So it can then follow that point through time, for EACH row you extract from the oldest certificate, also find the SAME physical row (same subRange, same nominal) in every later certificate.
IMPORTANT — keep the output small: for the OLDEST certificate give the FULL point (reading, lower, upper, tolerance, uncertainty, marker). For every LATER certificate give ONLY the reading (a single number) — do NOT repeat lower/upper/tolerance/uncertainty. Match by physical identity even if wording differs slightly.
UNITS, PREFIXES & RESOLUTION — this is a BASIC, MANDATORY skill; do not get it wrong:
READ EACH CELL INDEPENDENTLY. Every cell (reading, lower, upper, tolerance, uncertainty) may have its OWN unit, prefix, and resolution. Do NOT assume the cells in a row share a unit or resolution — look at each one.
1) PREFIXES: correctly identify the metric prefix on each cell (p=10^-12, n=10^-9, µ=10^-6, m=10^-3, none=1, k=10^3, M=10^6, G=10^9). Never confuse milli/micro/kilo — e.g. 13 µV, 1.4 mV, and 130 kΩ are all different scales. This is elementary; a wrong prefix corrupts the whole calculation.
2) NORMALIZE TO THE NOMINAL'S UNIT (per row — keep it AUTHENTIC to the certificate):
The base unit of each row is the unit of its NOMINAL value, exactly as printed. Keep Reading, Lower, Upper in that same unit as printed (they are usually already the same as the nominal).
   * If the nominal sub-range is "10 A", output the reading as 10, NOT 10000 — the unit stays A. NEVER convert 10 A into 10000 mA. Do not force a whole technology into one small prefix; each sub-range keeps its own printed unit.
   * Only cells that are printed in a DIFFERENT unit (most often the UNCERTAINTY, and sometimes a value given as a %) need converting — convert them INTO the nominal's unit so the math lines up. Example: nominal 10 A, uncertainty printed "10 mA" -> uncertainty 0.01 (in A). Example: nominal 100 mV, uncertainty "13 µV" -> 0.013 (in mV).
   * PERCENTAGES stay a per-cell job: a tolerance like "0.5% of reading" or "2% F.S." converts to an absolute value in the nominal's unit.
The goal: the numbers shown match the certificate (10 A reads as 10 A), and only genuinely different-unit cells (uncertainty, %) are converted so the calculation is correct. Set the technology "quantity" to the NOMINAL's unit of the selected row, not the smallest prefix in the technology.
3) PERCENTAGES: if tolerance or a limit is given as a percentage (%Reading, %F.S., %Rdg), convert it to an ABSOLUTE value in the reading's unit. E.g. tolerance "0.5% of reading" with reading 200.00 mV -> 1.00 mV; "±2% F.S." on a 100 mV full-scale -> 2 mV.
4) RESOLUTION ("decimals"): count the digits after the decimal point EXACTLY as printed in the READING cell — do not add or drop trailing digits. "-100.04" -> 2 (NOT 3), "10.002" -> 3, "100.0" -> 1, "220.00" -> 2, "800" -> 0. The decimals field describes the reading's printed resolution, independent of the (possibly finer) harmonized uncertainty.
The software computes the risk margin itself as: riskMargin = (min(upper-reading, reading-lower) - uncertainty)/(upper-lower), and selects the smallest — you do NOT need to do this.

STEP 5 - ADJUSTMENT DETECTION (ISO/IEC 17025:2017 clause 7.8.4.1(d)):
When an instrument is adjusted/repaired, the certificate reports results BEFORE and AFTER, with dates. Detect adjustment via THREE mechanisms (strongest first):
(1) EXPLICIT TEXT (any language): "Adjusted", "After Adjustment", "adjustment performed", "repaired", "tuned", "calibrated and adjusted", Hebrew "\\u05db\\u05d5\\u05d5\\u05e0\\u05df"/"\\u05ea\\u05d5\\u05e7\\u05df"/"\\u05d1\\u05d5\\u05e6\\u05e2 \\u05db\\u05d9\\u05d5\\u05d5\\u05e0\\u05d5\\u05df".
(2) TWO STATES WITH DIFFERENT VALUES: the certificate shows paired data under any of these conventions:
    - "As Found" / "As Left"
    - "Before" / "After" (Before Adjustment / After Adjustment)
    - "As Received" / "As Sent" (or "Received"/"Sent")
    - "Pre-adjustment" / "Post-adjustment"
    If the two states have DIFFERENT readings (beyond measurement uncertainty) -> adjustment = true.
    If the two states are IDENTICAL (or within uncertainty) -> adjustment = false (nothing changed).
(3) CONFORMITY STATEMENT SHIFT: e.g. "As Received: Conditional Pass / Fail ... As Sent: Pass" — a change in conformity between received and sent states indicates adjustment.
Rules:
- Only ONE state present (no before/after pair) and no explicit adjustment text -> adjustment = false.
- Instrument is a value-report type (e.g. standard resistor) with a single reported value -> adjustment = false.
Return "adjustment": true/false and, when detected, "adjustmentEvidence": short phrase found (e.g. "As Received Fail / As Sent Pass").

MARKER CONVENTIONS (any language/case/spacing):
- Serial: S.N. / SN / S/N / Serial No / \u05de\u05e1' \u05e1\u05d9\u05d3\u05d5\u05e8\u05d9
- Inventory: Inventory / Asset / INV ; Customer: Customer No / \u05de\u05e1' \u05dc\u05e7\u05d5\u05d7
- Manufacturer / \u05d9\u05e6\u05e8\u05df ; Model / \u05d3\u05d2\u05dd ; Cal date: CAL DATE / \u05ea\u05d0\u05e8\u05d9\u05da \u05db\u05d9\u05d5\u05dc

OUTPUT - CRITICAL: respond with ONLY the raw JSON object below. Do NOT write any explanation, reasoning, "STEP", commentary, or markdown fences. Your entire response must start with { and end with }. Nothing before, nothing after.

Notes:
- Each row carries its OWN "unit" (the nominal's printed unit for that sub-range, e.g. "mV" or "V" or "A") and its OWN "decimals" (digits printed in that row's reading). A "10 A" row has unit "A" and reading 10 — NOT unit "mA" and reading 10000.
- "certificates": one entry per uploaded certificate (index 0 = oldest). Put per-certificate checks (exceedance, adjustment, errors) here.
- "technologies": EVERY technology in the OLDEST certificate. "rows" = EVERY valid measurement row in that technology (across all its subRanges). The software selects the risk point(s) — you return them all.
- "rowCount": MANDATORY self-check. Before writing "rows", count the valid measurement lines you see for this technology in the oldest certificate and put that number here. Then make "rows" contain EXACTLY that many objects. If rowCount and the number of row objects disagree, you skipped a row (most often the middle 0.0 row) — fix it so they match. This field costs almost nothing but forces you to notice a missing zero.
- "technologyCount": MANDATORY self-check (prevents dropping a whole technology). BEFORE writing "technologies", scan the WHOLE certificate top to bottom and count the distinct MAIN HEADINGS (DC VOLTAGE, AC VOLTAGE, DC CURRENT, AC CURRENT, FREQUENCY, DUTY CYCLE, RESISTANCE, CAPACITANCE, CONDUCTANCE, TEMPERATURE, ...). Put that count here. Then make "technologies" contain EXACTLY that many objects. If they disagree, you dropped a technology — find it and add it before responding. COMMON DROP: a technology with only ONE row sitting at the BOTTOM of a page or right after a large technology (e.g. CONDUCTANCE "50 nS" is a single-row heading that often appears just after RESISTANCE — it is its OWN technology and MUST be returned as a separate entry, never merged into RESISTANCE and never skipped because it has only one row). A single-row technology is just as mandatory as a multi-row one. Scan explicitly for headings that have only one measurement line.
  DO NOT OVER-COUNT: count ONLY top-level physical-quantity headings. Do NOT count SUB-headings, sub-ranges, or modifiers as separate technologies. Specifically: "TC: \"K\"" (a thermocouple type under TEMPERATURE) is NOT its own technology — it is part of TEMPERATURE. "POWER FACTOR", "LEAD", "LAG" are sub-parts, not separate technologies. A sub-range line like "50 mV d.c." / "500 mV d.c." is NOT a technology. "AC" vs "DC" ARE separate (AC VOLTAGE ≠ DC VOLTAGE), but a unit/prefix change within one heading is NOT. technologyCount must equal the number of distinct MAIN headings only — if you are unsure whether a line is a heading or a sub-heading, it is a sub-heading. Your technologyCount MUST equal the number of technology objects you return; if you counted a sub-heading by mistake, correct the count DOWN to match the real main headings.
- "suspectMissingZero": set true ONLY if, after the two-pass zero verification, a symmetric range's middle zero could not be recovered (symmetry implies it exists but you could not read it). Otherwise false/omit. Never use this as a shortcut to skip the two-pass work.
- "oldest": the FULL point from the oldest certificate (index 0): reading, lower, upper, tolerance, uncertainty, marker.
- "laterReadings": one entry per LATER certificate (certIndex 1,2,...) for the SAME physical row: its reading, and its tolerance+uncertainty. CRITICAL: each later certificate has its OWN printed percent values — if that certificate prints tolerance/uncertainty/error as a percent, fill "tolPct"/"uncPct"/"errPct" (and their *PctType) FROM THAT CERTIFICATE's printed cells, exactly as for the oldest. The uncertainty spec CAN change between certificates (e.g. the oldest prints 0.025 %FS but the newest prints 0.03 %FS) — read each certificate's OWN printed value, never copy the oldest's percent onto a later certificate. Do NOT include lower/upper here — keep it small.
- NOMINAL is fixed per row across certificates. If a nominal would differ, it is not the same row — omit that laterReading.
- TOLERANCE derivation (do this exactly): Tolerance = |UpperLimit - Nominal| using absolute value. If the UpperLimit cell is "---"/blank (no number), use the LowerLimit instead: Tolerance = |LowerLimit - Nominal|. If BOTH limits are "---"/blank, the point has no manufacturer limits — DROP it (do not return that row). If tolerance is instead printed directly, or as %reading/%FS/permissible error, use that (converted to the reading's unit). Never compute (upper-lower)/2.
- All numbers in a row are in the SAME unit ("quantity"). Keep the certificate's own prefix and resolution.`;


// Convert a File (PDF) to base64 (no data: prefix) for the API document block.
async function fileToBase64(file){
  const buf=await file.arrayBuffer();
  const bytes=new Uint8Array(buf);
  let bin="";
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}
  return btoa(bin);
}

// Call the Anthropic API ONCE with ALL certificate PDFs (chronological order, oldest first).
// Returns parsed JSON: { certificates:[...], ranges:[...] } per the contract above.
async function aiExtractAll(files, apiKey, model, corrBlock){
  // Build content: alternating label + document, oldest first.
  const content=[
    {type:"text",text:"Here are "+files.length+" calibration certificates of the SAME instrument, in chronological order (oldest first, index 0). Follow the rules exactly. Pick each risk point from the OLDEST certificate and track that same physical sub-range across all of them.\n\nCRITICAL OUTPUT RULE: respond with ONLY the JSON object. First character { , last character }. No analysis, no preamble, no the word STEP."}
  ];
  for(let i=0;i<files.length;i++){
    const b64=await fileToBase64(files[i]);
    content.push({type:"text",text:"=== CERTIFICATE index "+i+(i===0?" (OLDEST)":"")+" ==="});
    content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}});
  }
  const body={
    model: model||"claude-sonnet-4-6",
    max_tokens: 16000,
    // Prompt caching: the big fixed instruction block is marked cache-worthy, so the API
    // reuses it across calls instead of re-processing ~3k tokens every time (much faster + cheaper).
    system: [
      {type:"text", text: AI_SYSTEM_PROMPT, cache_control:{type:"ephemeral"}},
      ...(corrBlock ? [{type:"text", text: corrBlock}] : [])
    ],
    messages:[{role:"user",content}]
  };
  // VER 5.8.1: API keys are ASCII-only. A pasted key sometimes carries an invisible
  // non-ASCII character (smart-dash, nbsp, hidden unicode) which makes fetch throw
  // "String contains non ISO-8859-1 code point". Strip anything outside printable ASCII.
  const cleanKey=(apiKey||"").replace(/[^\x21-\x7E]/g,"");
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":cleanKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    const errText=await resp.text();
    throw new Error("API "+resp.status+": "+errText.slice(0,300));
  }
  const data=await resp.json();
  let text=(data.content||[]).map(b=>b.type==="text"?b.text:"").join("").trim();
  text=text.replace(/^```json\s*/i,"").replace(/^```\s*/,"").replace(/```\s*$/,"").trim();
  let parsed;
  try{parsed=JSON.parse(text);}
  catch(e){
    const first=text.indexOf("{"), last=text.lastIndexOf("}");
    if(first>=0&&last>first){
      try{parsed=JSON.parse(text.slice(first,last+1));}
      catch(e2){throw new Error("\u05ea\u05e9\u05d5\u05d1\u05ea \u05d4-AI \u05d0\u05d9\u05e0\u05d4 JSON \u05ea\u05e7\u05d9\u05df: "+text.slice(0,200));}
    }else{
      throw new Error("\u05ea\u05e9\u05d5\u05d1\u05ea \u05d4-AI \u05d0\u05d9\u05e0\u05d4 JSON \u05ea\u05e7\u05d9\u05df: "+text.slice(0,200));
    }
  }
  return parsed;
}

// VER 2.18: auto Time Interval from calibration dates.
// TDAYS = days between current and previous certificate. TIME INTERVAL = TDAYS/365.
// Conditional rounding by month count (round(TDAYS/30.44)):
//   <=5 months  -> EXCLUDED (statistical noise, too short) -> {excluded:true}
//   window [12..15], [24..27], [36..39]... (12k..12k+3) -> rounded to k years
//   otherwise -> exact decimal (TDAYS/365)
// The <=5 exclusion applies only in the first year (no whole year completed yet).
function computeTimeInterval(prevDateStr, curDateStr){
  const prev=parseDMY(prevDateStr), cur=parseDMY(curDateStr);
  if(!prev||!cur) return {value:null, excluded:false, ready:false};
  const tdays=Math.round((cur-prev)/(1000*60*60*24));
  if(tdays<=0) return {value:null, excluded:false, ready:false, invalidOrder:true};
  const exact=tdays/365;
  const months=Math.round(tdays/30.44);
  // First-year exclusion: <=5 months
  if(months<=5) return {value:null, excluded:true, ready:true, tdays, months, exact};
  // Cyclic rounding window: remainder of months within a 12-month cycle is 0..3 -> round to k years
  const k=Math.floor(months/12);
  const rem=months-k*12;
  if(k>=1 && rem<=3){
    return {value:k, rounded:true, excluded:false, ready:true, tdays, months, exact, roundedTo:k};
  }
  // Otherwise exact decimal
  return {value:exact, rounded:false, excluded:false, ready:true, tdays, months, exact};
}
function fmtDMY(dt){if(!dt)return"";return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear()}
const uid=()=>Math.random().toString(36).slice(2);

function calcRow(row,shared,prevMeasured,isRef,opts,isLast){
  opts=opts||{};
  // opts.belowTURratio: fraction of the certificate's points with TUR<1.5 (from AI count)
  // opts.driftOk: whether this range passes the Drift Prediction (historical stability)
  // VER 2.16: timeInterval/duration/frequency/environment come from the SHARED row
  // (identical across ranges for the same certificate year). adjustment stays per-range.
  const m=parseFloat(row.measuredValue),p=prevMeasured,ti=parseFloat(shared.timeInterval);
  const tol=parseFloat(row.tolerance),unc=parseFloat(row.uncertainty);
  const nom=parseFloat(row.nominalValue);
  // Exceedance check: |Measured - Nominal| + Uncertainty < Tolerance (applies to REF too).
  // Percent certificates: when the row carries percent fields, check in PERCENT to match the
  // certificate's own rounded decision (avoids false FAIL from absolute rounding).
  const ePct=parseFloat(row.errorPct), tPct=parseFloat(row.tolPct), uPct=parseFloat(row.uncPct);
  const hasPct=(!isNaN(ePct)&&!isNaN(tPct)&&!isNaN(uPct));
  const EPS_X=1e-9;
  const exceedOk = hasPct
    ? ((Math.abs(ePct)+uPct) <= tPct+EPS_X)
    : ((!isNaN(m)&&!isNaN(nom)&&!isNaN(unc)&&!isNaN(tol))
        ?((Math.abs(m-nom)+unc) < tol)
        :null);
  // Drift only for non-REF rows (needs a Previous value)
  const drift=(!isRef&&!isNaN(m)&&p!==undefined&&!isNaN(p))?m-p:null;
  const driftPerYear=(drift!==null&&!isNaN(ti)&&ti!==0)?drift/ti:null;
  // TUR needs Tolerance + Uncertainty
  const tur=(!isNaN(tol)&&!isNaN(unc)&&unc!==0)?tol/unc:null;
  // V3.1 sanity check: an absurd TUR (>100 or <0.1) almost always means a unit/prefix extraction error.
  const turSuspect=(tur!==null)&&(tur>100||tur<0.1);
  // Decision requires ALL environment fields to be filled (same for REF and others)
  if(row.adjustment===""||shared.duration===""||shared.frequency===""||shared.environment===""){
    return{isRef,drift,driftPerYear,tur,turSuspect,usageScore:null,riskScore:null,exceedOk,decision:null,failReasons:[],env:null};
  }
  const adj=parseInt(row.adjustment),dur=parseInt(shared.duration),freq=parseInt(shared.frequency),env=parseInt(shared.environment);
  const usageScore=rnd((dur+freq)/2,0);
  // Risk score. For MOBILE equipment, mobility enters as a third averaging component
  // (Usage + Environment + 3)/3 — it nudges risk up gently without overshooting the pass threshold.
  // Fixed/stationary is unchanged: (Usage + Environment)/2.
  const riskScore=(opts&&opts.mobile)?rnd((usageScore+env+3)/3,0):rnd((usageScore+env)/2,0);
  const fail=[];
  let decision=null;
  let turStar=false; // true when TUR<1.5 but conditionally accepted (isolated + drift-stable)
  // For decision we need TUR (tolerance+uncertainty). Drift is NOT required (REF has none).
  if(tur!==null){
    if(adj!==0)fail.push("Adjustment performed (ADJUSTMENT=1)");
    // V5.9.7: The exceedance formula |M-N|+U >= Tolerance runs ONLY on the LATEST
    // certificate. Historical certificates are already gated by the AI marker
    // classification (C/cp/complies etc.), so the blind formula must not override
    // an old "C" (complies) point. Only the newest certificate is checked here.
    if(exceedOk===false&&isLast===true)fail.push("Exceedance: |M\u2212N|+U \u2265 Tolerance");
    // TUR flexibility (V2.5): threshold lowered 3 -> 1.5.
    // If TUR<1.5, allow a CONDITIONAL pass (asterisk) when the low-TUR points are isolated
    // (<= 1/3 of the certificate's points, i.e. >=2/3 have TUR>=1.5) AND the point is drift-stable
    // (Drift Prediction passes for this range). Otherwise it FAILs.
    if(tur<1.5){
      const isolated = (opts.belowTURratio!=null) ? (opts.belowTURratio <= (1/3)+1e-9) : false;
      const stable = opts.driftOk===true;
      if(isolated && stable){
        turStar=true; // conditional pass — do NOT add to fail
      }else{
        fail.push("TUR="+fmt(tur,2)+" < 1.5");
      }
    }
    if(env>2)fail.push("Environment="+env+" > 2");
    if(usageScore>3)fail.push("Usage score="+usageScore+" > 3");
    if(riskScore>2)fail.push("Risk score="+riskScore+" > 2");
    // V6.3: Drift Prediction failure is an INDEPENDENT FAIL condition. Previously the drift
    // result only affected the TUR<1.5 exemption, so a range with a healthy TUR (>=1.5) that
    // nonetheless FAILED its drift prediction (|M-N|+U_Total > Tolerance) was still shown PASS
    // in the tab and Decision (it only appeared in the global banner). Now a failed drift
    // prediction fails the row/tab directly, consistent with every other FAIL condition.
    if(opts.driftFailed===true)fail.push("Drift Prediction: |M\u2212N|+U_Total > Tolerance");
    decision=fail.length===0?(turStar?"PASS*":"PASS"):"FAIL";
  }
  return{isRef,drift,driftPerYear,tur,turStar,turSuspect,usageScore,riskScore,exceedOk,decision,failReasons:fail,env};
}

const newSharedRow=()=>({id:uid(),calibrationDate:"",certNo:"",timeInterval:"",duration:"",frequency:"",environment:"",durationManual:false,frequencyManual:false,environmentManual:false});
const newRangeRow=()=>({id:uid(),nominalValue:"",measuredValue:"",adjustment:"0",tolerance:"",uncertainty:"",pctType:"",errorPct:"",tolPct:"",uncPct:""});

// ── DatePicker ────────────────────────────────────────────────────────────────
function DatePicker({value,onChange,placeholder,inputStyle,minDate,disabled}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({top:0,left:0});
  const[vy,setVy]=useState(new Date().getFullYear());
  const[vm,setVm]=useState(new Date().getMonth());
  const ref=useRef(null);
  const inpRef=useRef(null);
  const parsed=parseDMY(value);
  const today=new Date();
  // VER 2.19: a day is blocked if it is on or before minDate (must be strictly later)
  const minTime=minDate?new Date(minDate.getFullYear(),minDate.getMonth(),minDate.getDate()).getTime():null;
  // VER 2.21: block future dates (today allowed, tomorrow onward blocked)
  const maxTime=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();})();
  const isBlocked=d=>{if(!d)return false;const t=new Date(vy,vm,d).getTime();if(minTime!==null&&t<=minTime)return true;if(t>maxTime)return true;return false;};

  useEffect(()=>{
    const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",fn);
    return()=>document.removeEventListener("mousedown",fn);
  },[]);

  function openCal(){
    if(disabled)return;
    if(inpRef.current){
      const r=inpRef.current.getBoundingClientRect();
      const top=window.innerHeight-r.bottom>260?r.bottom+2:r.top-264;
      setPos({top,left:Math.min(r.left,window.innerWidth-234)});
    }
    // When opening, jump to the month after minDate if the current view is before it
    if(minDate&&!parsed){setVy(minDate.getFullYear());setVm(minDate.getMonth());}
    setOpen(o=>!o);
  }

  const dim=(y,m)=>new Date(y,m+1,0).getDate();
  const fd=(y,m)=>new Date(y,m,1).getDay();
  const prev=()=>{if(vm===0){setVm(11);setVy(y=>y-1)}else setVm(m=>m-1)};
  const next=()=>{if(vm===11){setVm(0);setVy(y=>y+1)}else setVm(m=>m+1)};
  const selDay=d=>{if(isBlocked(d))return;onChange(fmtDMY(new Date(vy,vm,d)));setOpen(false)};

  const cells=[];
  for(let i=0;i<fd(vy,vm);i++)cells.push(null);
  for(let d=1;d<=dim(vy,vm);d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  const isSel=d=>parsed&&d&&parsed.getFullYear()===vy&&parsed.getMonth()===vm&&parsed.getDate()===d;
  const isTod=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;

  return h("div",{ref,style:{position:"relative",display:"inline-block",width:"100%"}},
    h("div",{style:{display:"flex",alignItems:"center",width:"100%"}},
      h("input",{ref:inpRef,readOnly:true,value:value||"",placeholder:disabled?"\u05d4\u05de\u05ea\u05df...":(placeholder||"DD/MM/YYYY"),
        onClick:openCal,
        style:{...(inputStyle||{}),cursor:disabled?"not-allowed":"pointer",paddingRight:22,width:"100%",border:"none",background:"transparent",fontSize:12,textAlign:"center",outline:"none",color:disabled?"#cbd5e1":"#0f172a",padding:"2px 0"}}),
      h("span",{onClick:openCal,style:{position:"absolute",right:2,cursor:disabled?"not-allowed":"pointer",fontSize:12,color:disabled?"#cbd5e1":"#64748b",pointerEvents:"none"}},disabled?"\ud83d\udd12":"\ud83d\udcc5")
    ),
    open&&!disabled&&h("div",{style:{position:"fixed",top:pos.top,left:pos.left,zIndex:99999,background:"#fff",border:"1px solid #cbd5e1",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,.22)",padding:10,minWidth:224}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        h("button",{onClick:prev,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"\u2039"),
        h("span",{style:{fontWeight:700,fontSize:12,color:"#0f172a"}},MONTHS[vm]+" "+vy),
        h("button",{onClick:next,style:{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#475569",padding:"0 4px"}},"\u203a")
      ),
      h("div",{style:{display:"flex",justifyContent:"center",gap:3,marginBottom:8}},
        [vy-2,vy-1,vy,vy+1,vy+2].map(y=>h("button",{key:y,onClick:()=>setVy(y),style:{fontSize:10,padding:"2px 5px",border:"1px solid",borderColor:y===vy?"#2563eb":"#e2e8f0",borderRadius:4,background:y===vy?"#2563eb":"#fff",color:y===vy?"#fff":"#475569",cursor:"pointer",fontWeight:y===vy?700:400}},y))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}},
        WDAYS.map(d=>h("div",{key:d,style:{textAlign:"center",fontSize:10,fontWeight:700,color:"#94a3b8"}},d))
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}},
        cells.map((d,i)=>{const blk=isBlocked(d);return h("button",{key:i,onClick:()=>d&&!blk&&selDay(d),disabled:blk,style:{textAlign:"center",fontSize:11,padding:"4px 2px",border:"none",borderRadius:5,cursor:!d?"default":blk?"not-allowed":"pointer",background:isSel(d)?"#2563eb":isTod(d)?"#eff6ff":"transparent",color:!d?"transparent":blk?"#e2e8f0":isSel(d)?"#fff":isTod(d)?"#2563eb":"#334155",fontWeight:isSel(d)||isTod(d)?700:400}},d||"")})
      ),
      h("div",{style:{marginTop:8,textAlign:"center"}},
        h("button",{onClick:()=>{const t=new Date();if(minTime!==null&&new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime()<=minTime)return;setVy(t.getFullYear());setVm(t.getMonth());selDay(t.getDate())},style:{fontSize:11,color:"#2563eb",background:"none",border:"none",cursor:"pointer",fontWeight:600}},"Today"),
        h("button",{onClick:()=>{onChange("");setOpen(false)},style:{fontSize:11,color:"#94a3b8",background:"none",border:"none",cursor:"pointer",marginLeft:10}},"Clear")
      )
    )
  );
}

// ── Report builder ────────────────────────────────────────────────────────────
function buildReport(p){

  const rangeSummary=ranges.map((rng,ri)=>{const s=rangePassStatus[ri],c=s==="pass"?"#16a34a":s==="fail"?"#dc2626":"#999";return`<tr><td style="padding:6px 10px;border:1px solid #ddd;font-weight:600">${rng.label} [${unitOf(rng)}]</td><td style="padding:6px 10px;border:1px solid #ddd;text-align:center;font-weight:800;color:${c}">${s==="pass"?"\u2713 PASS":s==="fail"?"\u2717 FAIL":"\u2014"}</td></tr>`}).join("");
  const verdict=extensionApproved
    ?`<div style="background:#f0fdf4;border:2px solid #16a34a;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#16a34a;margin-bottom:8px">\u2713 CONCLUSION: Calibration Interval Extension APPROVED</div><p style="font-size:12px;color:#166534;line-height:1.7;margin-bottom:6px">All measurement ranges demonstrated stable performance. All decision criteria were satisfied for every range and every comparison period, and the drift prediction remains within tolerance.</p><p style="font-size:12px;color:#166534;font-weight:700">Serial Number: <u>${serialNumber||"N/A"}</u>${customerNo?" \u00b7 Customer No: <u>"+customerNo+"</u>":""} \u2014 calibration interval may be extended by ${yearsText||"one additional year"}.</p></div>`
    :`<div style="background:#fef2f2;border:2px solid #dc2626;border-radius:10px;padding:20px 24px;margin:16px 0"><div style="font-size:17px;font-weight:800;color:#dc2626;margin-bottom:8px">\u2717 CONCLUSION: Calibration Interval Extension NOT APPROVED</div><p style="font-size:12px;color:#991b1b;line-height:1.7;margin-bottom:6px">One or more ranges did not satisfy all decision criteria, or the drift prediction exceeded tolerance.</p><p style="font-size:12px;color:#991b1b;font-weight:700">Serial Number: <u>${serialNumber||"N/A"}</u>${customerNo?" \u00b7 Customer No: <u>"+customerNo+"</u>":""} must be calibrated at the standard interval.</p></div>`;
  const rangeDetails=ranges.map((rng,ri)=>{
    const rCalc=allRangesCalc[ri],status=rangePassStatus[ri],sc=status==="pass"?"#16a34a":"#dc2626",sbg=status==="pass"?"#f0fdf4":"#fef2f2";
    const unit=unitOf(rng),dec=rng.decimals;
    const dataRows=sharedRows.map((shared,i)=>{
      const isRef=i===0,calc=rCalc[i],rrow=rng.rows[i];
      const prevVal=i>0&&rng.rows[i-1].measuredValue!==""?Number(rng.rows[i-1].measuredValue).toFixed(dec):"\u2014";
      const dc=(calc.decision==="PASS"||calc.decision==="PASS*")?"#16a34a":calc.decision==="FAIL"?"#dc2626":"#999";
      const nomD=rrow.nominalValue!==""&&!isNaN(parseFloat(rrow.nominalValue))?Number(rrow.nominalValue).toFixed(dec)+" "+unit:"\u2014";
      const measD=rrow.measuredValue!==""&&!isNaN(parseFloat(rrow.measuredValue))?Number(rrow.measuredValue).toFixed(dec)+" "+unit:"\u2014";
      const tolD=rrow.tolerance!==""&&!isNaN(parseFloat(rrow.tolerance))?Number(rrow.tolerance).toFixed(rng.tolDecimals)+" "+(rng.tolPrefix||"")+rng.quantity:(rrow.tolerance||"\u2014");

    return`<div style="margin-bottom:28px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:10px 14px;background:${sbg};border:1.5px solid ${sc};border-radius:8px"><h3 style="margin:0;font-size:14px">${rng.label} <span style="font-size:11px;font-weight:400;color:#475569">[${unit}]</span></h3><span style="font-size:13px;font-weight:800;color:${sc}">${status==="pass"?"\u2713 ALL PASS":"\u2717 FAIL"}</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#0f172a;color:#e2e8f0"><th style="padding:6px 7px;border:1px solid #1e293b">#</th><th style="padding:6px 7px;border:1px solid #1e293b">Date</th><th style="padding:6px 7px;border:1px solid #1e293b">Nominal \u2192 Measured</th><th style="padding:6px 7px;border:1px solid #1e293b">Drift<br><span style="font-weight:400;font-size:9px">total / per year</span></th><th style="padding:6px 7px;border:1px solid #1e293b">Tol / Unc</th><th style="padding:6px 7px;border:1px solid #1e293b">TUR</th><th style="padding:6px 7px;border:1px solid #1e293b">Adj</th><th style="padding:6px 7px;border:1px solid #1e293b">Usage / Risk</th><th style="padding:6px 7px;border:1px solid #1e293b">Decision</th><th style="padding:6px 7px;border:1px solid #1e293b">Cert.NO</th></tr></thead><tbody>${dataRows}</tbody></table></div>${analysis?"<div style='margin-top:10px'>"+analysis+"</div>":""}</div>`;

font-size:20px;font-weight:800">CALIBRATION INTERVAL EVALUATION REPORT</div><div style="font-size:10px;color:#64748b">ISO/IEC 17025:2017 \u00b7 ILAC G24 / OIML D10 \u00b7 JCGM 100 (GUM)</div></div><h2>1. Instrument Identification</h2><div class="mg"><div class="mi"><label>Serial Number</label><span>${serialNumber||"\u2014"}</span></div><div class="mi"><label>Customer No</label><span>${customerNo||"\u2014"}</span></div><div class="mi"><label>Manufacturer</label><span>${manufacturer||"\u2014"}</span></div><div class="mi"><label>Model</label><span>${model||"\u2014"}</span></div><div class="mi"><label>Equipment Type</label><span>${equipmentType==="mobile"?"Mobile":"Stationary"}</span></div><div class="mi"><label>Report Date</label><span>${reportDate}</span></div><div class="mi"><label>Historical Certificates in Analysis</label><span>${sharedRows.length} (1 reference + ${sharedRows.length-1} comparison)</span></div><div class="mi"><label>Prepared By</label><span>${preparedBy||"\u2014"}</span></div><div class="mi"><label>Organization</label><span>${orgName||"\u2014"}</span></div></div><div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:10px 16px;margin:0 0 16px;font-size:11px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">\u2713</span><div><strong style="color:#16a34a">Certificate Exceedances: None reported</strong><br><span style="color:#166534">The operator confirmed no exceedances exist in any calibration certificate evaluated.</span></div></div><h2>2. Calibration Certificates Referenced</h2><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">#</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Date</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Certificate No.</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Role</th></tr></thead><tbody>${certRows}</tbody></table><h2>3. Evaluation Result</h2>${verdict}<table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:10px"><thead><tr style="background:#f1f5f9"><th style="padding:6px 10px;border:1px solid #ddd;text-align:left">Range</th><th style="padding:6px 10px;border:1px solid #ddd;text-align:center">Result</th></tr></thead><tbody>${rangeSummary}</tbody></table><h2>4. Methodology</h2><p style="font-size:11px;color:#334155;line-height:1.7;margin-bottom:10px">Follows <strong>ISO/IEC 17025:2017</strong> (Clauses 6.4.7, 7.6, 7.7, 7.8.6), <strong>ILAC G24/OIML D10</strong>, and <strong>JCGM 100:2008 (GUM)</strong>.</p><table class="fml"><tr><td>Drift</td><td>Measured\u2099 \u2212 Measured\u2099\u208b\u2081</td></tr><tr><td>Drift per Year</td><td>Drift \u00f7 Time Interval</td></tr><tr><td>TUR</td><td>Tolerance \u00f7 Uncertainty</td></tr><tr><td>Usage score</td><td>ROUND((Duration + Frequency) \u00f7 2, 0)</td></tr><tr><td>Risk score</td><td>${equipmentType==="mobile"?"ROUND((Usage score + Environment + 3) \u00f7 3, 0) \u2013 Mobile":"ROUND((Usage score + Environment) \u00f7 2, 0)"}</td></tr></table><p style="font-size:11px;font-weight:700;margin:10px 0 5px">FAIL conditions:</p><ul class="crit"><li><strong>ADJUSTMENT = YES</strong></li><li><strong>TUR &lt; 1.5</strong> (unless it is an isolated point \u2264\u2153 that also passes Drift \u2192 PASS*)</strong></li><li><strong>Environment &gt; 2</strong></li><li><strong>Usage score &gt; 3</strong></li><li><strong>Risk score &gt; 2</strong></li><li><strong>|Measured \u2212 Nominal| + Uncertainty \u2265 Tolerance</strong> (exceedance)</li><li><strong>Conditional Pass (cp) in the latest certificate</strong> \u2013 blocks extension (see note)</li></ul><p style=\"font-size:10.5px;color:#475569;line-height:1.7;margin:8px 0 0\"><strong>Certificate marker gating (entry rule).</strong> Each certificate's conformity marker is classified per ILAC-G8. A blocking marker (fc, f, NC, or \"\\u2014\\u2014\\u2014\" cannot-determine) in any certificate prevents extension. A <strong>Conditional Pass (cp)</strong> \u2014 outside the acceptance limits but inside the specification limits \u2014 is gated by position: cp appearing <strong>only in historical certificates</strong> is accepted (the instrument no longer exhibits it in the most recent calibration), whereas cp in the <strong>latest (most recent) certificate</strong> blocks extension. The exceedance formula above is evaluated on the latest certificate only; historical certificates are gated by their markers.</p><h2>5. Detailed Results by Range</h2>${rangeDetails}<h2>6. Authorization</h2><div class="sig"><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px"><div><div class="sl">Prepared by: ${preparedBy||"________________________"}</div><div style="font-size:10px;color:#555;margin-top:8px">Date: ${reportDate}</div></div><div><div class="sl">Reviewed by: ________________________</div><div style="font-size:10px;color:#555;margin-top:8px">Date: ________________________</div></div></div></div><div class="disc">Generated by Calibration Interval Evaluation System. For inclusion in the calibration file and ANAB/ILAC auditor presentation.</div></div></body></html>`;

// ── VER 5.8.3: standalone, printable Audit Notes (2 pages, readable font). ──

function buildAuditNotesHtml(equipmentType){
  const riskMobile = equipmentType==="mobile"

  const pre=(t)=>`<pre class="mono">${t}</pre>`;
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Audit Notes \u2013 How the System Decides</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;background:#fff;font-size:12px;line-height:1.6}

</style></head><body>
<div class="noprint" style="background:#1e40af;padding:12px 24px;display:flex;align-items:center;justify-content:space-between">
  <span style="color:#fff;font-weight:700;font-size:14px">Audit Notes \u2013 How the System Decides</span>
  <button onclick="window.print()" style="background:#fff;color:#1e40af;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer">\ud83d\udda8 Print / Save as PDF</button>
</div>
<div class="page">
  <div style="border-bottom:3px solid #0f172a;padding-bottom:12px;margin-bottom:16px">
    <h1>AUDIT NOTES \u2014 HOW THE SYSTEM DECIDES</h1>
    <div class="sub">ISO/IEC 17025:2017 \u00b7 ILAC G24 / OIML D10 \u00b7 JCGM 100 (GUM)</div>
  </div>

  <h2>1. Core Formulas</h2>
  <table class="kv">
    <tr><td>Drift</td><td>Measured\u2099 \u2212 Measured\u2099\u208b\u2081</td></tr>
    <tr><td>Drift per Year</td><td>Drift \u00f7 Time Interval (years)</td></tr>
    <tr><td>Tolerance</td><td>| Upper limit \u2212 Nominal |</td></tr>
    <tr><td>TUR</td><td>Tolerance \u00f7 Uncertainty</td></tr>
    <tr><td>Usage score</td><td>ROUND((Duration + Frequency) / 2)</td></tr>
    <tr><td>Risk score</td><td>${riskMobile}</td></tr>
  </table>

  <h2>2. Risk-Point Selection (deterministic)</h2>
  <p>The AI only extracts the measurement rows. The software \u2014 not the AI \u2014 selects the risk point, so the same certificates always yield the same choice. For each candidate row it computes a normalized safety margin and picks the smallest (most dangerous):</p>
  ${pre("riskMargin = ( min(Upper\u2212Reading, Reading\u2212Lower) \u2212 Uncertainty ) / (Upper\u2212Lower)")}
  <p>Multiple technologies \u2192 one risk point per technology. Single technology \u2192 one point per sub-range (up to the 3 riskiest). A row centered on zero in a symmetric range is usually the smallest-margin point and is checked explicitly.</p>

  <h2>3. Drift Prediction \u2014 the full chain</h2>
  <p>Read top to bottom. Each result is named, and that same name is the input to a later step \u2014 nothing appears from nowhere.</p>
  ${pre(
"Inputs from the certificate:\n"+
"  U_cert    = the \"UNCERTAINTY \u00b1\" value printed on the certificate\n"+
"              (example: 58 \u00b5V), stated at coverage factor k = 2 (~95%)\n"+
"  Tolerance = | Upper limit \u2212 Nominal |\n"+
"  M , N     = measured value and nominal value of the risk point")}
  ${pre(
"Step 1 \u2014 drift per year, from the instrument's history   \u2192  AnnualRate\n"+
"         (MEAN for 3 certificates, SYD-weighted for 4\u20135)\n\n"+
"Step 2 \u2014 scale by the extension time                     \u2192  DriftPredicted\n"+
"         DriftPredicted = AnnualRate \u00d7 (Tnext + 1)\n"+
"         uses AnnualRate from Step 1\n"+
"         (total predicted drift across the WHOLE new interval)")}
  ${pre(
"Two independent uncertainty sources, prepared separately:\n\n"+
"  Source A \u2014 from the predicted drift:\n"+
"     u_drift = DriftPredicted / \u221a3     uses DriftPredicted from Step 2\n"+
"                                       (\u00f7\u221a3 : rectangular distribution, Type B)\n\n"+
"  Source B \u2014 from the certificate:\n"+
"     u_cal   = U_cert / 2              uses U_cert from the certificate\n"+
"                                       (\u00f72 : remove k=2 \u2192 standard, to combine)")}
  ${pre(
"Merge (RSS) and re-expand:\n"+
"     U_Total = 2 \u00b7 \u221a( u_cal\u00b2 + u_drift\u00b2 )\n"+
"               |   \u2514\u2500 combine the two STANDARD uncertainties (A + B)\n"+
"               \u2514\u2500\u2500\u2500\u2500 \u00d72 : put k=2 back, so U_Total is expanded for the test\n\n"+
"     (the \u00f72 in Source B and the \u00d72 here are the same k=2 \u2014 removed to\n"+
"      combine, restored to test. See \u00a74 for the algebra.)")}
  ${pre(
"Final acceptance test:\n"+
"     | M \u2212 N | + U_Total  \u2264  Tolerance ?\n"+
"       \u2713 holds \u2192 calibration interval may be extended\n"+
"       \u2717 fails \u2192 FAIL").replace('class="mono"','class="mono ok"')}

  <div class="tc">The time component \u2014 why \u00d7 (Tnext + 1)</div>
  <p>AnnualRate is drift for one single year. Extending the interval means the instrument keeps drifting over the entire new period, so predicted drift scales with the number of years:</p>
  <p style="margin-bottom:4px"><b>Tnext</b> = the extension the operator requests (1 or 2 additional years).<br>
  <b>Tnext + 1</b> = the total new interval in years (the extension is beyond the current period):<br>
  <span style="color:#475569">&nbsp;&nbsp;request 1 \u2192 \u00d72 (1 yr \u2192 2 yr) \u00b7 request 2 \u2192 \u00d73 (2 yr \u2192 3 yr)</span></p>
  <p style="margin-bottom:4px">The extension is constrained by the current interval (from the most recent certificate):</p>
  <table class="ct"><tr><th>Current interval</th><th>Max extension (Tnext)</th></tr>
    <tr><td>\u2264 1 year</td><td>up to 2</td></tr>
    <tr><td>\u2264 2 years</td><td>up to 1</td></tr>
    <tr><td>&gt; 2 years</td><td>none</td></tr></table>

  <div class="pb"></div>
  <h2>4. Why U_Total = \u221a( U_cert\u00b2 + (4/3)\u00b7DriftPredicted\u00b2 ) \u2014 step by step</h2>
  <p>The compact form is algebraically identical to the RSS combination in \u00a73. Derivation, general to every technology (symbols only):</p>
  ${pre(
"Step 1:  U_Total = 2\u00b7\u221a( u_cal\u00b2 + u_drift\u00b2 )\n\n"+
"Step 2:  u_cal   = U_cert / 2       \u2192  u_cal\u00b2   = U_cert\u00b2 / 4\n"+
"         u_drift = DriftPred / \u221a3   \u2192  u_drift\u00b2 = DriftPred\u00b2 / 3\n\n"+
"Step 3:  U_Total = 2\u00b7\u221a( U_cert\u00b2/4 + DriftPred\u00b2/3 )\n\n"+
"Step 4:  = \u221a( 4\u00b7( U_cert\u00b2/4 + DriftPred\u00b2/3 ) )      (2 = \u221a4, moved inside)\n\n"+
"Step 5:  = \u221a( U_cert\u00b2 + (4/3)\u00b7DriftPred\u00b2 )\n"+
"         because 4\u00d7(1/4) = 1  and  4\u00d7(1/3) = 4/3").replace('class="mono"','class="mono ok"')}
  <p>So the coefficient on U_cert\u00b2 is 1, and on DriftPredicted\u00b2 is 4/3. The same formula applies to every technology (temperature, voltage, resistance\u2026); U_cert and DriftPredicted always carry that technology's own unit.</p>

  <h2>5. FAIL Conditions (any one triggers FAIL)</h2>
  <ul class="crit">
    <li><b>ADJUSTMENT = YES</b></li>
    <li><b>TUR &lt; 1.5</b> (unless an isolated point \u2264\u2153 that also passes Drift \u2192 PASS*)</li>
    <li><b>Environment &gt; 2</b></li>
    <li><b>Usage score &gt; 3</b></li>
    <li><b>Risk score &gt; 2</b></li>
    <li><b>| Measured \u2212 Nominal | + Uncertainty \u2265 Tolerance</b> (exceedance)</li>
    <li><b>Conditional Pass (cp) in the latest certificate</b></li>
  </ul>

  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin:12px 0;font-size:11.5px;line-height:1.75;color:#334155">
    <b style="color:#0f172a">Certificate marker gating (entry rule).</b><br>
    Before any drift/uncertainty analysis, each certificate's conformity marker is classified per ILAC-G8 (p, cp, n/a, fc, f, and the legacy C / NC / \u2014\u2014\u2014 conventions).<br>

// Computes Stage A (annual predicted rate), Stage B (predicted drift), Stage C (approval).
// drifts = array of |Drift per Year| values, oldest first. tNext = 1 or 2 years.
// latest = {measured, nominal, tolerance, uncertainty} from the most recent certificate.
function computeDriftPrediction(drifts, tNext, latest){
  const n = drifts.length; // number of drifts = certificates - 1
  // Need at least 2 drifts (3 certificates)
  if(n < 2) return {ok:null, reason:"need_more", nCerts:n+1};
  if(n > 4) return {ok:null, reason:"too_many", nCerts:n+1};
  const D = drifts.map(Math.abs);
  let annualRate = null;
  if(n === 2){
    // N=3: arithmetic MEAN of the two drifts (|D1|+|D2|)/2 — replaces the old max()
    annualRate = (D[0] + D[1]) / 2;
  } else if(n === 3){
    // N=4: SYD 0.167,0.333,0.500 (oldest->newest)
    annualRate = 0.167*D[0] + 0.333*D[1] + 0.500*D[2];
  } else if(n === 4){
    // N=5: full SYD 0.10,0.20,0.30,0.40 (oldest->newest)
    annualRate = 0.10*D[0] + 0.20*D[1] + 0.30*D[2] + 0.40*D[3];
  }
  if(annualRate === null || tNext == null || isNaN(tNext)) return {ok:null, reason:"incomplete", annualRate};
  const {measured, nominal, tolerance, uncertainty} = latest;
  if([measured,nominal,tolerance,uncertainty].some(v=>v==null||isNaN(v))) return {ok:null, reason:"incomplete", annualRate};
  // Stage A: DriftPredicted = AnnualRate × (Tnext + 1)
  // The client's choice extends BEYOND the current period: choice 1 -> ×2 (1yr→2yr), choice 2 -> ×3 (2yr→3yr).
  // AnnualRate is drift PER YEAR; yearsFactor is the total new interval in years.
  const yearsFactor = tNext + 1;
  const driftPredicted = annualRate * yearsFactor;
  // GUM-based uncertainty combination (replaces the old over-strict linear addition):
  //   Stage B: u_drift = DriftPredicted / √3      (Type B, rectangular distribution)
  //   Stage C: u_cal   = U / 2                    (lab uncertainty is expanded, k=2 → standard)
  //   Stage D: U_Total = 2 × √(u_cal² + u_drift²) (RSS, re-expanded to k=2)
  //            equivalently  U_Total = √(U² + (4/3)·DriftPredicted²)
  const uDrift = driftPredicted / Math.sqrt(3);
  const uCal = uncertainty / 2;
  const uTotal = 2 * Math.sqrt(uCal*uCal + uDrift*uDrift);
  // Stage E (decision rule): |M-N| + U_Total <= Tolerance
  const lhs = Math.abs(measured - nominal) + uTotal;
  // Floating-point tolerance: treat values within 1e-9 as equal so 0.10 <= 0.10 passes
  const EPS = 1e-9;
  const ok = lhs <= tolerance + EPS;
  return {ok, annualRate, driftPredicted, yearsFactor, uDrift, uCal, uTotal, lhs, tolerance, tNext, nCerts:n+1};
}
