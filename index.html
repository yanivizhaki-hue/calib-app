      // so the same certificates always yield the same choice (audit-grade consistency).
      const nTech=technologies.length;
      // V4.8 safety net: detect symmetric ranges (both -/+ nominals) that are missing their zero row.
      // This catches the AI skipping the middle 0.0 row despite the prompt.
      // V5.6: also cross-check the AI's self-declared rowCount against the rows actually returned —
      // if the AI counted more than it returned, it silently dropped a row (usually the middle zero).
      const zeroWarnings=[];
      technologies.forEach(tech=>{
        const bySub={};
        (tech.rows||[]).forEach(rw=>{const k=rw.subRange||"";(bySub[k]=bySub[k]||[]).push(rw);});
        Object.keys(bySub).forEach(k=>{
          const noms=bySub[k].map(rw=>Number(rw.nominal)).filter(n=>isFinite(n));
          const hasNeg=noms.some(n=>n<0), hasPos=noms.some(n=>n>0), hasZero=noms.some(n=>n===0);
          if(hasNeg&&hasPos&&!hasZero){
            zeroWarnings.push((tech.name||"?")+(k?(" @ "+k):"")+" \u2013 \u05d8\u05d5\u05d5\u05d7 \u05e1\u05d9\u05de\u05d8\u05e8\u05d9 \u05dc\u05dc\u05d0 \u05e9\u05d5\u05e8\u05ea \u05d0\u05e4\u05e1");
          }
        });
        // rowCount self-check (V5.6): AI declared it counted N but returned fewer → it dropped a row.
        // VER 5.8: honor the AI's own suspectMissingZero flag (set when the two-pass check
        // implied a zero exists but the AI could not recover it) — surface it as a warning.
        if(tech.suspectMissingZero===true){
          zeroWarnings.push((tech.name||"?")+" \u2013 \u05d4-AI \u05e1\u05d9\u05de\u05df \u05d7\u05e9\u05d3 \u05dc\u05e9\u05d5\u05e8\u05ea \u05d0\u05e4\u05e1 \u05d7\u05e1\u05e8\u05d4 (\u05dc\u05d0 \u05d4\u05e6\u05dc\u05d9\u05d7 \u05dc\u05d7\u05dc\u05e5 \u2013 \u05d1\u05d3\u05d5\u05e7 \u05d9\u05d3\u05e0\u05d9\u05ea)");
        }
        const declared=Number(tech.rowCount);
        const returned=(tech.rows||[]).length;
        if(isFinite(declared)&&declared>returned){
          zeroWarnings.push((tech.name||"?")+" \u2013 \u05d4-AI \u05e1\u05e4\u05e8 "+declared+" \u05e9\u05d5\u05e8\u05d5\u05ea \u05d0\u05da \u05d4\u05d7\u05d6\u05d9\u05e8 "+returned+" (\u05d9\u05d9\u05ea\u05db\u05df \u05e9\u05d3\u05d5\u05dc\u05d2\u05d4 \u05e9\u05d5\u05e8\u05d4 \u2013 \u05d1\u05d3\u05d5\u05d1 \u05d4\u05d0\u05e4\u05e1)");
        }
      });
      if(techCountWarning)zeroWarnings.unshift(techCountWarning);
      setZeroWarn(zeroWarnings);
      const singleTech=nTech===1;
      // A point is VALID for selection only if it has real numeric reading, lower, upper (lower<upper),
      // and the reading lies within [lower,upper]. Rows built from "---" limits fail this and are dropped.
      const numOrNull=v=>(v==null||v===""||v==="---")?null:(isFinite(Number(v))?Number(v):null);
      // FS (full-scale) for a technology = the largest absolute nominal/reading magnitude in it.
      // Used to turn a %FS tolerance into an absolute limit distance for selection.
      const fsOfTech=tech=>{
        let fs=null;
        (tech&&tech.rows||[]).forEach(tr=>{
          [numOrNull(tr.nominal), tr.oldest?numOrNull(tr.oldest.reading):null].forEach(v=>{
            if(v!=null){const a=Math.abs(v); if(fs==null||a>fs)fs=a;}
          });
        });
        return fs;
      };
      // Effective absolute tolerance (limit distance from nominal) for a point.
      // Priority: explicit absolute tolerance -> percent tolerance (tolPct) via FS or reading.
      const effTolOf=(p,fs)=>{
        if(!p)return null;
        const tAbs=numOrNull(p.tolerance);
        if(tAbs!=null&&tAbs>0)return tAbs;
        const tPct=numOrNull(p.tolPct);
        if(tPct!=null&&tPct>0){
          const type=(p.tolPctType||p.errPctType||p.uncPctType||"FS");
          if(type==="RDG"){const rr=numOrNull(p.reading); return (rr!=null)?Math.abs(tPct)/100*Math.abs(rr):null;}
          return (fs!=null)?Math.abs(tPct)/100*fs:null;
        }
        return null;
      };
      // Return usable [lo,up] for a point: real limits if present, else derived from nominal ± effTol.
      const bandOf=(p,nominal,fs)=>{
        let lo=numOrNull(p.lower), up=numOrNull(p.upper);
        const nom=numOrNull(nominal!=null?nominal:p.nominal);
        if(lo==null&&up!=null&&nom!=null)lo=nom-(up-nom);
        if(up==null&&lo!=null&&nom!=null)up=nom+(nom-lo);
        if((lo==null||up==null)&&nom!=null){
          const t=effTolOf(p,fs);
          if(t!=null&&t>0){ lo=nom-t; up=nom+t; }
        }
        return {lo,up};
      };
      const isValidPoint=(p,nominal,fs)=>{
        if(!p)return false;
        const r=numOrNull(p.reading);
        if(r==null)return false;
        let lo=numOrNull(p.lower), up=numOrNull(p.upper);
        // Percentage points (force meters etc.) have NO printed Lower/Upper — accept them when a
        // tolerance (absolute or percent) is available, since tolerance IS the limit distance.
        if(lo==null&&up==null){
          const t=effTolOf(p,fs);
          if(t!=null&&t>0)return true;
          return false;
        }
        if(lo!=null&&up!=null){
          if(!(up>lo))return false;
          if(r<lo-Math.abs(up-lo)||r>up+Math.abs(up-lo))return false;
        }
        return true;
      };
      const riskMarginOf=(p,nominal,fs)=>{
        if(!isValidPoint(p,nominal,fs))return Infinity;
        const r=numOrNull(p.reading);
        const {lo,up}=bandOf(p,nominal,fs);
        if(lo==null||up==null||!(up>lo))return Infinity;
        const u=Number(p.uncertainty)||0;
        return (Math.min(up-r, r-lo) - u) / (up-lo);
      };
      // Build the list of "selected rows" (each becomes one Range in the form).
      // Case A (multi-tech): 1 riskiest row per technology.
      // Case B (single-tech): 1 riskiest row per subRange (up to 3 riskiest subRanges).
      // Selection uses rw.oldest (the FULL point from the oldest cert). Tracking uses rw.laterReadings.
      const selected=[]; // {tech, quantity, decimals, row}
      technologies.forEach(tech=>{
        const techFS=fsOfTech(tech);
        // Only keep rows whose oldest point is a valid, usable measurement point.
        const rows=(tech.rows||[]).filter(rw=>rw&&rw.oldest&&isValidPoint(rw.oldest, rw.nominal, techFS));
        if(!rows.length)return;
        const marginOf=rw=>riskMarginOf(rw.oldest, rw.nominal, techFS);
        if(singleTech){
          // group rows by subRange, pick riskiest per subRange
          const bySub={};
          rows.forEach(rw=>{const k=rw.subRange||"";(bySub[k]=bySub[k]||[]).push(rw);});
          let subPicks=Object.keys(bySub).map(k=>{
            const best=bySub[k].slice().sort((a,b)=>marginOf(a)-marginOf(b))[0];
            return {tech,row:best,margin:marginOf(best)};
          });
          // up to 3 riskiest subRanges
          subPicks.sort((a,b)=>a.margin-b.margin);
          subPicks.slice(0,3).forEach(sp=>selected.push({tech,quantity:tech.quantity,decimals:tech.decimals,row:sp.row}));
        }else{
          // riskiest single row across the whole technology
          const best=rows.slice().sort((a,b)=>marginOf(a)-marginOf(b))[0];
          selected.push({tech,quantity:tech.quantity,decimals:tech.decimals,row:best});
        }
      });
      if(!selected.length){setAiError("\u05dc\u05d0 \u05e0\u05de\u05e6\u05d0\u05d5 \u05e0\u05e7\u05d5\u05d3\u05d5\u05ea \u05de\u05d3\u05d9\u05d3\u05d4 \u05ea\u05e7\u05e4\u05d5\u05ea");setAiBusy(false);return;}

      // 5) Turn each selected row into a Range. REF row = oldest (full); later rows = laterReadings.
      const newRanges=selected.map((sel,ri)=>{
        const rw=sel.row;
        const o=rw.oldest||{};
        // Per-row unit & decimals keep each sub-range authentic (10 A stays "A", not "mA").
        const rowUnit=(rw.unit&&String(rw.unit).trim())?String(rw.unit).trim():(sel.quantity||"");
        const rowDecRaw=(rw.decimals!=null&&!isNaN(rw.decimals))?rw.decimals:sel.decimals;
        const dec=(rowDecRaw!=null&&!isNaN(rowDecRaw))?Math.max(0,Math.min(8,parseInt(rowDecRaw))):4;
        // Code-side tolerance (safety net, matches the rule): |Upper - Nominal|, else |Lower - Nominal|.
        // Round to the row's resolution to avoid floating-point artifacts (0.16999999... -> 0.17).
        const nomN=numOrNull(rw.nominal);
        const upN=numOrNull(o.upper), loN=numOrNull(o.lower);
        const roundTo=(v,d)=>{if(v==null||isNaN(v))return v;const f=Math.pow(10,Math.min(8,d+2));return Math.round(v*f)/f;};
        let tolCalc=null;
        if(nomN!=null&&upN!=null)tolCalc=roundTo(Math.abs(upN-nomN),dec);
        else if(nomN!=null&&loN!=null)tolCalc=roundTo(Math.abs(loN-nomN),dec);
        // Prefer the code-computed tolerance; fall back to the AI's value only if we couldn't compute it.
        let tolOldest=(tolCalc!=null)?tolCalc:(o.tolerance!=null?o.tolerance:null);
        // ── GENERIC PERCENT HANDLING (any certificate, cell by cell) ──
        // The AI copies percent cells verbatim (tolPct/tolPctType, uncPct/uncPctType, errPct/errPctType).
        // The CODE does every conversion. FS (full-scale) for "%FS" = the largest absolute measured/
        // nominal magnitude in this technology's range (per the metrology rule). "%RDG" uses the point's
        // own reading. tolerance/uncertainty are computed here; lower/upper are derived from tolerance
        // (tolerance IS the limit distance from nominal), so risk selection keeps working.
        const techRows=(sel.tech.rows||[]);
        let fsVal=null;
        techRows.forEach(tr=>{
          const cand=[numOrNull(tr.nominal), tr.oldest?numOrNull(tr.oldest.reading):null];
          cand.forEach(v=>{ if(v!=null){ const a=Math.abs(v); if(fsVal==null||a>fsVal)fsVal=a; } });
        });
        const pctToAbs=(pct,type,pointReading)=>{
          if(pct==null||isNaN(parseFloat(pct)))return null;
          const p=Math.abs(parseFloat(pct));
          if(type==="RDG"){ const rr=numOrNull(pointReading); return (rr!=null)?p/100*Math.abs(rr):null; }
          // default/FS
          return (fsVal!=null)?p/100*fsVal:null;
        };
        // If the AI gave a percent tolerance and we have no absolute tolerance, compute it now.
        const oTolPct=o.tolPct, oTolType=o.tolPctType;
        const tolFromPct=pctToAbs(oTolPct,oTolType,o.reading);
        if((tolOldest==null||isNaN(parseFloat(tolOldest)))&&tolFromPct!=null){ tolOldest=roundTo(tolFromPct,dec); }
        // Uncertainty from percent (oldest) if the uncertainty cell was a percent.
        const uncFromPctOldest=pctToAbs(o.uncPct,o.uncPctType,o.reading);
        const isPctTol=(oTolPct!=null&&!isNaN(parseFloat(oTolPct)));
        const isPctUnc=(o.uncPct!=null&&!isNaN(parseFloat(o.uncPct)));
        const isPctErr=(o.errPct!=null&&!isNaN(parseFloat(o.errPct)));
        // Map later readings by certIndex (1,2,...)
        const laterByIdx={}; (rw.laterReadings||[]).forEach(p=>{laterByIdx[p.certIndex]=p;});
        const label=(sel.tech.name||"Range")+" @ "+(rw.subRange||"");
        const rows=rid.sorted.map((c,rowi)=>{
          let reading=null, tol=null, unc=null;
          const lp=(rowi===0)?null:(laterByIdx[rowi]||null);
          // V8.2: each row uses ITS OWN certificate's printed percent values. The uncertainty (and
          // sometimes tolerance) spec CAN change between certificates — e.g. the oldest prints
          // 0.025 %FS but the newest prints 0.03 %FS. rowi 0 = oldest (o.*); rowi>0 = that later
          // certificate (lp.*), falling back to the oldest's value only when the later cert did
          // not restate it. This is what stops the newest cert's 0.03 being overwritten by 0.025.
          const rowUncPct     = (rowi===0)? o.uncPct     : ((lp&&lp.uncPct!=null)     ? lp.uncPct     : o.uncPct);
          const rowUncPctType = (rowi===0)? o.uncPctType : ((lp&&lp.uncPctType!=null) ? lp.uncPctType : o.uncPctType);
          const rowTolPct     = (rowi===0)? oTolPct      : ((lp&&lp.tolPct!=null)     ? lp.tolPct     : oTolPct);
          const rowTolPctType = (rowi===0)? oTolType     : ((lp&&lp.tolPctType!=null) ? lp.tolPctType : oTolType);
          const rowErrPct     = (rowi===0)? o.errPct     : ((lp&&lp.errPct!=null)     ? lp.errPct     : null);
          const rowIsPctUnc=(rowUncPct!=null&&!isNaN(parseFloat(rowUncPct)));
          const rowIsPctTol=(rowTolPct!=null&&!isNaN(parseFloat(rowTolPct)));
          const rowIsPctErr=(rowErrPct!=null&&!isNaN(parseFloat(rowErrPct)));
          if(rowi===0){ // REF = oldest full point
            reading=o.reading; tol=tolOldest; unc=(isPctUnc?uncFromPctOldest:o.uncertainty);
          }else{ // later certificate = tracked reading (percent values from THAT cert)
            reading=lp?lp.reading:null;
            // tolerance: percent tol recomputed from this row's own percent (RDG uses this reading)
            if(rowIsPctTol){ tol=roundTo(pctToAbs(rowTolPct,rowTolPctType,(reading!=null?reading:o.reading)),dec); }
            else { tol=(lp&&lp.tolerance!=null)?lp.tolerance:tolOldest; }
            // uncertainty: percent unc recomputed from this row's own printed percent
            if(rowIsPctUnc){ unc=pctToAbs(rowUncPct,rowUncPctType,(reading!=null?reading:o.reading)); }
            else { unc=(lp&&lp.uncertainty!=null)?lp.uncertainty:o.uncertainty; }
          }
          // Percent display + exceedance fields — all from THIS row's own certificate.
          let errPctRow="", tolPctRow="", uncPctRow="", pctTypeRow="";
          if(rowIsPctErr||rowIsPctTol||rowIsPctUnc){
            pctTypeRow=(rowUncPctType||rowTolPctType||o.errPctType||"FS");
            if(rowIsPctTol)tolPctRow=String(Math.abs(parseFloat(rowTolPct)));
            if(rowIsPctUnc)uncPctRow=String(Math.abs(parseFloat(rowUncPct)));
            if(rowIsPctErr){ errPctRow=String(Math.abs(parseFloat(rowErrPct))); }
            else if(isPctErr&&reading!=null&&rw.nominal!=null){
              // later cert didn't restate err% but oldest was percent → derive from reading
              const errAbs=Math.abs(parseFloat(reading)-parseFloat(rw.nominal));
              const basis=(pctTypeRow==="RDG")?Math.abs(parseFloat(reading)):fsVal;
              errPctRow=(basis&&basis>0)?String(errAbs/basis*100):"";
            }
          }
          return {...newRangeRow(),
            adjustment:adjByIndex(rowi),
            nominalValue:rw.nominal!=null?String(rw.nominal):"",
            measuredValue:reading!=null?String(reading):"",
            tolerance:tol!=null?String(tol):"",
            uncertainty:unc!=null?String(unc):"",
            pctType:pctTypeRow,
            errorPct:errPctRow,
            tolPct:tolPctRow,
            uncPct:uncPctRow
          };
        });
        return {...newRange("Range "+(ri+1),newShared.map(()=>null)), label, quantity:rowUnit||"", rows, decimals:dec, tolDecimals:dec};
      });
      // 6) Commit to state
      setSerialNumber(rid.identity.serialNumber||"");
      setCustomerNo(rid.identity.customerNo||"");
      setSerialOptional(!!rid.identity.serialOptional);
      setCustomerNoConflict(!!rid.identity.customerNoConflict);
      setManufacturer(rid.identity.manufacturer||"");
      setModel(rid.identity.model||"");
      setScanNote({manufacturer:rid.identity.manufacturer,model:rid.identity.model,usedInventoryAsSerial:rid.identity.usedInventoryAsSerial});
      setSharedRows(newShared);
      setRanges(newRanges);
      setActiveRange(0);
      setHasExceedance("no");
      setScanDone(true);
      setAiDone(true);
      setAiBusy(false);
      setAiOpen(false);
    }catch(err){
      setAiError("\u05e9\u05d2\u05d9\u05d0\u05d4: "+err.message);
      setAiBusy(false);
    }
  }
  function saveCorrection(){
    const t=corrText.trim();
    if(!t)return;
    setCorrections(cs=>[...cs,{id:uid(),note:t}]);
    setCorrText("");
    setCorrOpen(false);
  }
  function removeCorrection(id){setCorrections(cs=>cs.filter(c=>c.id!==id));}
  function updateRangeRow(ri,rowIdx,field,val){
    setRanges(rs=>rs.map((rng,r)=>{
      if(r!==ri)return rng;
      // Nominal, Tolerance, Uncertainty copy from REF (row 0) to rows that are empty or match old REF value
      if(rowIdx===0&&(field==="nominalValue"||field==="tolerance"||field==="uncertainty")){
        const cv=rng.rows[0][field];
        return{...rng,rows:rng.rows.map((row,rowi)=>{if(rowi===0)return{...row,[field]:val};if(row[field]===""||row[field]===cv)return{...row,[field]:val};return row})};
      }
      return{...rng,rows:rng.rows.map((row,rowi)=>rowi!==rowIdx?row:{...row,[field]:val})};
    }));
  }
  function updateRange(ri,field,val){setRanges(rs=>rs.map((r,i)=>i!==ri?r:{...r,[field]:val}))}
  function addRange(){const l="Range "+(ranges.length+1);setRanges(rs=>[...rs,newRange(l,sharedRows)]);setActiveRange(ranges.length)}
  function removeRange(idx){if(ranges.length<=1)return;setRanges(rs=>rs.filter((_,i)=>i!==idx));setActiveRange(prev=>Math.min(prev,ranges.length-2))}
  function updateRangeLabel(idx,label){setRanges(rs=>rs.map((r,i)=>i===idx?{...r,label}:r))}

  // VER 2.18: auto-compute Time Interval per row from calibration dates (REF has no previous)
  const computedTI=sharedRows.map((sr,i)=>{
    if(i===0) return {value:null, excluded:false, ready:false}; // REF: no previous
    return computeTimeInterval(sharedRows[i-1].calibrationDate, sr.calibrationDate);
  });
  // Build effective shared rows where timeInterval reflects the computed value (string, for calcRow)
  // VER 2.24: Duration/Frequency/Environment are STICKY — rows inherit from the first row (index 0)
  // until manually edited on that row.
  const src=sharedRows[0]||{};
  const effShared=sharedRows.map((sr,i)=>{
    const ti=computedTI[i];
    const tiVal=(ti&&ti.ready&&!ti.excluded&&ti.value!=null)?String(ti.value):"";
    const dur=(i>0&&!sr.durationManual)?src.duration:sr.duration;
    const frq=(i>0&&!sr.frequencyManual)?src.frequency:sr.frequency;
    const env=(i>0&&!sr.environmentManual)?src.environment:sr.environment;
    return {...sr, timeInterval:tiVal, duration:dur, frequency:frq, environment:env};
  });
  const anyTIExcluded=computedTI.some(ti=>ti&&ti.excluded);
  const excludedTIRows=computedTI.map((ti,i)=>(ti&&ti.excluded)?i:-1).filter(i=>i>=0);

  // V2.5: FIRST (preliminary) pass — computes drift/driftPerYear needed for predictions.
  // The TUR-flexibility decision needs the drift result, so real decisions come in a second pass below.
  const calcPrelim=sharedRows.map((sr,i)=>calcRow(range.rows[i],effShared[i],i>0?parseFloat(range.rows[i-1].measuredValue):undefined,i===0));
  const allRangesCalcPrelim=ranges.map(rng=>sharedRows.map((sr,i)=>calcRow(rng.rows[i],effShared[i],i>0?parseFloat(rng.rows[i-1].measuredValue):undefined,i===0)));

  // ── VER 2.18: Tnext constraint from LAST-ROW auto-computed Time Interval ──
  const lastTI=computedTI[computedTI.length-1];
  const maxTI=(lastTI&&lastTI.ready&&!lastTI.excluded&&lastTI.value!=null)?lastTI.value:null;
  // Determine allowed Tnext
  let tNextMax=null; // null=unknown/no data, 0=none, 1=one year, 2=two years
  if(maxTI!==null){
    if(maxTI<=1)tNextMax=2;
    else if(maxTI<=2)tNextMax=1;
    else tNextMax=0;
  }
  // Per-range drift prediction (Stage A/B/C)
  // VER 2.17: the stored tNext may be stale after Time Interval changes.
  // Derive an EFFECTIVE value: a selection above the current allowance is invalid.
  const tNextRaw=tNext===""?null:parseInt(tNext);
  const tNextInvalid=tNextRaw!==null&&(tNextMax===null||tNextMax===0||tNextRaw>tNextMax);
  const tNextNum=tNextInvalid?null:tNextRaw;
  const rangePredictions=ranges.map((rng,ri)=>{
    // Build drifts array (|Drift per Year|) oldest first, from row 1 onward
    const rc=allRangesCalcPrelim[ri];
    const drifts=[];
    for(let i=1;i<rng.rows.length;i++){
      const dpy=rc[i].driftPerYear;
      if(dpy!==null&&!isNaN(dpy))drifts.push(dpy);
    }
    // Latest certificate = last row
    const lastIdx=rng.rows.length-1;
    const lastRow=rng.rows[lastIdx];
    const latest={
      measured:parseFloat(lastRow.measuredValue),
      nominal:parseFloat(lastRow.nominalValue),
      tolerance:parseFloat(lastRow.tolerance),
      uncertainty:parseFloat(lastRow.uncertainty)
    };
    return computeDriftPrediction(drifts,tNextNum,latest);
  });
  // ── V2.7: TUR-flexibility computed IN CODE from the chosen risk points (fast, deterministic) ──
  // The AI only picks the risk points. Here the software computes each range's TUR (latest row),
  // counts how many risk points have TUR<1.5, and derives the ratio across all risk points.
  const rangeTURs=ranges.map(rng=>{
    const lastRow=rng.rows[rng.rows.length-1];
    const tol=parseFloat(lastRow&&lastRow.tolerance), unc=parseFloat(lastRow&&lastRow.uncertainty);
    return (isFinite(tol)&&isFinite(unc)&&unc>0)?(tol/unc):null;
  });
  const validTURs=rangeTURs.filter(t=>t!=null);
  const belowCount=validTURs.filter(t=>t<1.5).length;
  const globalBelowRatio=validTURs.length>0?(belowCount/validTURs.length):null;
  const rangeTurOpts=ranges.map((rng,ri)=>{
    const pred=rangePredictions[ri];
    const driftOk=pred?pred.ok===true:false;
    // V6.3: driftFailed is TRUE only on a GENUINE prediction failure (ok===false),
    // NOT when the prediction is merely incomplete (ok===null: too few/many certs).
    // This drives the independent drift FAIL without punishing incomplete data.
    const driftFailed=pred?pred.ok===false:false;
    return {belowTURratio:globalBelowRatio, driftOk, driftFailed, mobile:equipmentType==="mobile"};
  });
  const allRangesCalc=ranges.map((rng,ri)=>sharedRows.map((sr,i)=>calcRow(rng.rows[i],effShared[i],i>0?parseFloat(rng.rows[i-1].measuredValue):undefined,i===0,rangeTurOpts[ri],i===sharedRows.length-1)));
  const calculated=allRangesCalc[activeRange]||calcPrelim;
  const allCompDecisions=allRangesCalc.flatMap(rc=>rc.map(c=>c.decision));
  const hasAnyDecision=allCompDecisions.some(d=>d!==null);
  // PASS* counts as passing for the global verdict.

            ranges.map((rng,ri)=>h("div",{key:rng.id,onClick:()=>setActiveRange(ri),style:{padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",background:rangePassStatus[ri]==="pass"?"#dcfce7":rangePassStatus[ri]==="fail"?"#fee2e2":"#f1f5f9",color:sc(rangePassStatus[ri]),border:"1px solid "+(rangePassStatus[ri]==="pass"?"#86efac":rangePassStatus[ri]==="fail"?"#fca5a5":"#e2e8f0")}},rng.label+" ["+unitOf(rng)+"]: "+sl(rangePassStatus[ri])))
          )
        ),

        // ── VER 2.7: Tnext selector + Drift Prediction (Stage C) ──────────────
        h("div",{style:{marginTop:16,borderRadius:12,border:"2px solid #6366f1",background:"#eef2ff",padding:"16px 20px"}},
          h("div",{style:{fontSize:14,fontWeight:800,color:"#4338ca",marginBottom:4}},"\u05d7\u05d9\u05d6\u05d5\u05d9 \u05e1\u05d7\u05e3 \u05dc\u05ea\u05e7\u05d5\u05e4\u05ea \u05d4\u05d0\u05e8\u05db\u05d4 \u2013 Drift Prediction"),
          h("div",{style:{fontSize:11,color:"#4b5563",marginBottom:12}},"\u05d4\u05ea\u05e0\u05d0\u05d9 \u05d4\u05e1\u05d5\u05e4\u05d9 (GUM/RSS): |Measured \u2212 Nominal| + U_Total \u2264 Tolerance  \u2003\u05db\u05d0\u05e9\u05e8  U_Total = \u221a(U\u00b2 + (4/3)\u00b7DriftPredicted\u00b2)"),
          // Tnext selector
          h("div",{style:{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",marginBottom:14,paddingBottom:14,borderBottom:"1px solid #c7d2fe"}},
            h("span",{style:{fontSize:13,fontWeight:700,color:"#3730a3"}},"Tnext \u2013 \u05ea\u05e7\u05d5\u05e4\u05ea \u05d4\u05d0\u05e8\u05db\u05d4 \u05d4\u05de\u05d1\u05d5\u05e7\u05e9\u05ea:"),
            h("button",{onClick:()=>!reportBlocked&&tNextMax>=1&&setTNext("1"),disabled:reportBlocked||tNextMax===0||tNextMax===null,style:{padding:"8px 20px",borderRadius:8,border:"2px solid",borderColor:tNextNum===1?"#4338ca":"#c7d2fe",background:tNextNum===1?"#4338ca":"#fff",color:tNextNum===1?"#fff":((!reportBlocked&&tNextMax>=1)?"#4338ca":"#c7d2fe"),fontWeight:700,fontSize:13,cursor:(!reportBlocked&&tNextMax>=1)?"pointer":"not-allowed",opacity:(!reportBlocked&&tNextMax>=1)?1:0.5}},"\u05e9\u05e0\u05d4 \u05d0\u05d7\u05ea (1)"),
            h("button",{onClick:()=>!reportBlocked&&tNextMax>=2&&setTNext("2"),disabled:reportBlocked||tNextMax<2||tNextMax===null,style:{padding:"8px 20px",borderRadius:8,border:"2px solid",borderColor:tNextNum===2?"#4338ca":"#c7d2fe",background:tNextNum===2?"#4338ca":"#fff",color:tNextNum===2?"#fff":((!reportBlocked&&tNextMax>=2)?"#4338ca":"#c7d2fe"),fontWeight:700,fontSize:13,cursor:(!reportBlocked&&tNextMax>=2)?"pointer":"not-allowed",opacity:(!reportBlocked&&tNextMax>=2)?1:0.5}},"\u05e9\u05e0\u05ea\u05d9\u05d9\u05dd (2)"),
            tNext!==""&&h("button",{onClick:()=>setTNext(""),style:{padding:"8px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",color:"#94a3b8",fontSize:12,cursor:"pointer"}},"\u05e0\u05e7\u05d4"),
            maxTI!==null&&h("span",{style:{fontSize:11,color:"#6b7280",marginLeft:"auto"}},"Time Interval \u05de\u05e8\u05d1\u05d9: "+maxTI+" \u05e9\u05e0\u05d4/\u05d9\u05dd")
          ),
          // Tnext constraint messages
          tNextInvalid&&tNextMax!==0&&tNextMax!==null&&h("div",{style:{marginBottom:12,padding:"10px 14px",background:"#fff7ed",border:"2px solid #f97316",borderRadius:8,fontSize:12,color:"#9a3412",fontWeight:700}},"\u26a0 \u05d4\u05d1\u05d7\u05d9\u05e8\u05d4 \u05d4\u05e7\u05d5\u05d3\u05de\u05ea \u05d0\u05d9\u05e0\u05d4 \u05ea\u05e7\u05e4\u05d4 \u05e2\u05d5\u05d3 \u2013 Time Interval \u05d4\u05e9\u05ea\u05e0\u05d4. \u05d9\u05e9 \u05dc\u05d1\u05d7\u05d5\u05e8 \u05de\u05d7\u05d3\u05e9 \u05d0\u05ea \u05ea\u05e7\u05d5\u05e4\u05ea \u05d4\u05d4\u05d0\u05e8\u05db\u05d4."),
          tNextMax===0&&h("div",{style:{marginBottom:12,padding:"10px 14px",background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,fontSize:12,color:"#991b1b",fontWeight:700}},"\u2717 Time Interval \u05de\u05e2\u05dc \u05e9\u05e0\u05ea\u05d9\u05d9\u05dd \u2013 \u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05d0\u05e8\u05d9\u05da \u05ea\u05d5\u05e7\u05e3 \u05db\u05dc\u05dc"),
          tNextMax===1&&h("div",{style:{marginBottom:12,padding:"10px 14px",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,fontSize:12,color:"#92400e"}},"\u26a0 Time Interval \u05de\u05e2\u05dc \u05e9\u05e0\u05d4 \u05d5\u05e2\u05d3 \u05e9\u05e0\u05ea\u05d9\u05d9\u05dd \u2013 \u05e0\u05d9\u05ea\u05df \u05dc\u05d4\u05d0\u05e8\u05d9\u05da \u05e9\u05e0\u05d4 \u05d0\u05d7\u05ea \u05d1\u05dc\u05d1\u05d3"),
          // Per-range Stage C results
          h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            ranges.map((rng,ri)=>{
              const pred=rangePredictions[ri];
              let statusColor="#94a3b8",statusText="\u2014 \u05de\u05de\u05ea\u05d9\u05df \u05dc\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd",statusBg="#f8fafc";
              let detail=null;
              if(pred.reason==="need_more"){statusText="\u05d7\u05e1\u05e8\u05d4 \u05ea\u05e2\u05d5\u05d3\u05d4 \u2013 \u05e0\u05d3\u05e8\u05e9\u05d5\u05ea \u05dc\u05e4\u05d7\u05d5\u05ea 3 \u05ea\u05e2\u05d5\u05d3\u05d5\u05ea";statusColor="#b45309";statusBg="#fffbeb";}
              else if(pred.reason==="too_many"){statusText="\u05d9\u05d5\u05ea\u05e8 \u05de\u05d3\u05d9 \u05ea\u05e2\u05d5\u05d3\u05d5\u05ea (\u05de\u05e7\u05e1\u05d9\u05de\u05d5\u05dd 5)";statusColor="#b45309";statusBg="#fffbeb";}
              else if(pred.reason==="incomplete"){statusText="\u05de\u05de\u05ea\u05d9\u05df \u05dc-Tnext \u05d5\u05dc\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05de\u05dc\u05d0\u05d9\u05dd";statusColor="#94a3b8";statusBg="#f8fafc";}
              else if(pred.ok===true){statusText="\u2713 \u05e2\u05d5\u05d1\u05e8 \u2013 \u05d4\u05e1\u05d7\u05e3 \u05d4\u05e6\u05e4\u05d5\u05d9 \u05d1\u05ea\u05d5\u05da \u05d4\u05d8\u05d5\u05dc\u05e8\u05e0\u05e1";statusColor=PASS_GREEN;statusBg="#f0fdf4";}
              else if(pred.ok===false){statusText="\u2717 \u05e0\u05db\u05e9\u05dc \u2013 \u05d4\u05e1\u05d7\u05e3 \u05d4\u05e6\u05e4\u05d5\u05d9 \u05d7\u05d5\u05e8\u05d2 \u05de\u05d4\u05d8\u05d5\u05dc\u05e8\u05e0\u05e1";statusColor=FAIL_RED;statusBg="#fef2f2";}
              if(pred.annualRate!==undefined&&pred.annualRate!==null){
                // VER 2.12: show the method + exact formula used, per certificate count
                const nC=pred.nCerts;
                // VER 2.15: show 2 extra decimals in the prediction panel so the exact math is visible
                const predDec=Math.min(rng.decimals+2,8);
                let methodName="",methodFormula="";
                if(nC===3){methodName="MEAN method";methodFormula="AnnualRate = (|D\u2081| + |D\u2082|) / 2";}
                else if(nC===4){methodName="SYD model";methodFormula="AnnualRate = 0.167\u00b7|D\u2081| + 0.333\u00b7|D\u2082| + 0.500\u00b7|D\u2083|";}
                else if(nC===5){methodName="SYD model";methodFormula="AnnualRate = 0.10\u00b7|D\u2081| + 0.20\u00b7|D\u2082| + 0.30\u00b7|D\u2083| + 0.40\u00b7|D\u2084|";}
                detail=h("div",{style:{fontSize:11,color:"#4b5563",fontFamily:"monospace",marginTop:6,lineHeight:1.8}},
                  methodName?h("span",{style:{fontWeight:700,color:"#4338ca",fontFamily:"'Segoe UI',Arial,sans-serif"}},"\u05e9\u05d9\u05d8\u05ea \u05d7\u05d9\u05e9\u05d5\u05d1 ("+nC+" \u05ea\u05e2\u05d5\u05d3\u05d5\u05ea): "+methodName):null,
                  methodName?h("br"):null,
                  methodFormula?methodFormula:null,
                  methodFormula?h("br"):null,
                  "AnnualRate = "+fmt(pred.annualRate,predDec)+" ("+pred.nCerts+" certs, "+(pred.nCerts-1)+" drifts)",
                  pred.driftPredicted!==undefined?h("br"):null,
                  pred.driftPredicted!==undefined?"DriftPredicted = "+fmt(pred.annualRate,predDec)+" \u00d7 "+pred.yearsFactor+" (Tnext="+pred.tNext+"+1) = "+fmt(pred.driftPredicted,predDec):null,
                  pred.uTotal!==undefined?h("br"):null,
                  pred.uTotal!==undefined?"U_Total = \u221a(U\u00b2 + (4/3)\u00b7DriftPred\u00b2) = "+fmt(pred.uTotal,predDec):null,
                  pred.lhs!==undefined?h("br"):null,
                  pred.lhs!==undefined?"|M\u2212N| + U_Total = "+fmt(pred.lhs,predDec)+" "+(pred.ok?"\u2264":">")+" Tolerance = "+fmt(pred.tolerance,predDec):null
                );
              }
              return h("div",{key:rng.id,style:{padding:"12px 16px",borderRadius:10,background:statusBg,border:"1.5px solid "+statusColor}},
                h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}},
                  h("span",{style:{fontSize:13,fontWeight:700,color:"#0f172a"}},rng.label+" ["+unitOf(rng)+"]"),
                  h("span",{style:{fontSize:12,fontWeight:800,color:statusColor}},statusText)
                ),
                detail
              );
            })
          )
        ),

        // Reference tables
        h("div",{style:{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
          h("div",{style:{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 16px"}},
            h("div",{style:{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:10,borderBottom:"1px solid #e2e8f0",paddingBottom:6}},"Formulas"),
            [["Drift","Measured Value \u2212 Previous Value"],["Drift per Year","Drift \u00f7 Time Interval"],["TUR","Tolerance \u00f7 Uncertainty"],["Usage score (1-5)","(Duration + Frequency) \u00f7 2 [rounded]"],["Risk score (1-5)",equipmentType==="mobile"?"(Usage score + Environment + 3) \u00f7 3 [rounded] \u2013 \u05e0\u05d9\u05d9\u05d3":"(Usage score + Environment) \u00f7 2 [rounded]"]].map(function(kv){return h("div",{key:kv[0],style:{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #f8fafc",fontSize:11}},h("span",{style:{fontWeight:600,color:"#334155"}},kv[0]),h("span",{style:{color:"#64748b",fontFamily:"monospace"}},kv[1]))})
          ),
          h("div",{style:{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 16px"}},
            h("div",{style:{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:10,borderBottom:"1px solid #e2e8f0",paddingBottom:6}},"Decision rule: FAIL if ANY condition"),
            ["ADJUSTMENT = YES","TUR < 1.5","Environment > 2","Usage score > 3","Risk score > 2","|Measured \u2212 Nominal| + Uncertainty \u2265 Tolerance"].map(function(c){return h("div",{key:c,style:{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:"1px solid #f8fafc",fontSize:11}},h("span",{style:{color:FAIL_RED,fontWeight:700}},"\u2717"),h("span",{style:{fontFamily:"monospace",color:"#334155"}},c))})
          )
        ),
        h("div",{style:{marginTop:12,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"12px 16px",fontSize:11,color:"#64748b"}},
          h("strong",{style:{color:"#0f172a"}},"Methodological Basis \u00b7 "),
          "ISO/IEC 17025:2017 (Clauses 6.4.7, 7.6, 7.7, 7.8.6) \u00b7 ILAC G24 / OIML D10 \u00b7 JCGM 100 (GUM)",
          h("span",{style:{color:"#94a3b8",fontStyle:"italic"}}," \u00b7 'Usage score' and 'risk index' are internal engineering tools not explicitly defined in the above standards.")
        )
      )
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

/* ── VER 5.9.4: live COLORED measurement-instrument backdrop ──
   10 calibration instruments, full multi-colour, bold. A grid-cell allocator
   keeps instruments from overlapping (each active instrument owns a free cell);
   they rise, hold, fade, free their cell, and a new one takes an empty cell.
   Pure decoration behind #root; no effect on logic. */
(function(){
  var layer=document.getElementById("instrbg");
  if(!layer) return;
  // V8.4.1: floating PHYSICS + METROLOGY FORMULAS backdrop.
  // Formulas fade in, drift up at a random diagonal angle, then fade out and
  // respawn in a free grid cell. Reuses the .instr / instFloat infrastructure.
  // Pure decoration behind #root; no effect on logic.
  // Set FORMULA_BG_ENABLED=false to disable the animated backdrop entirely.
  var FORMULA_BG_ENABLED=true;
  if(!FORMULA_BG_ENABLED) return;
  var FORMULAS=[
    "E = mc\u00b2","v = u + at","s = ut + \u00bdat\u00b2","v\u00b2 = u\u00b2 + 2as",
    "F = ma","p = mv","E\u2096 = \u00bdmv\u00b2","F = G\u00b7m\u2081m\u2082/r\u00b2",
    "a = \u0394v/\u0394t","P = W/t","c = \u03bbf","E = hf","\u03bb = h/p",
    "\u0394x\u00b7\u0394p \u2265 \u210f/2","TUR = Tol/U","Drift = M\u2082\u2212M\u2081",
    "\u03c3 = \u221a(\u03a3(x\u2212\u03bc)\u00b2/n)","\u03bc \u00b1 k\u00b7u",
    "Drift/Yr = D/\u0394t","AnnualRate \u00d7 (1+T)","\u222b f(x) dx",
    "W = Fd","\u03c4 = r\u00d7F","PV = nRT","\u03bb = h/mv"
  ];
  var COLOR="#64748b";            // slate-grey, matches the lab-board look
  var MAXOP=0.5;
  // grid anti-overlap: divide viewport into cells; each live formula owns one.
  var COLS=4, ROWS=3, CELLS=COLS*ROWS;
  var busy=new Array(CELLS).fill(false);
  function rnd(a,b){return a+Math.random()*(b-a);}
  function freeCell(){var f=[];for(var i=0;i<CELLS;i++)if(!busy[i])f.push(i);return f.length?f[Math.floor(Math.random()*f.length)]:-1;}
  function spawn(){
    var cell=freeCell();
    if(cell<0){ setTimeout(spawn, 700); return; }   // all cells busy — wait, then retry
    busy[cell]=true;
    var col=cell%COLS, row=Math.floor(cell/COLS);
    var txt=FORMULAS[Math.floor(Math.random()*FORMULAS.length)];
    // position jittered inside the cell so it doesn't look grid-locked
    var leftPct=(col/COLS)*100 + rnd(2,(100/COLS)-6);
    var topPct =(row/ROWS)*100 + rnd(2,(100/ROWS)-6);
    var fsize=rnd(20,32).toFixed(0);
    var r=rnd(-24,24).toFixed(0)+"deg";           // diagonal tilt
    var dur=rnd(8,13).toFixed(1)+"s", delay=(-rnd(0,5)).toFixed(1)+"s";
    var el=document.createElement("div");
    el.className="instr";
    el.style.cssText="left:"+leftPct+"%;top:"+topPct+"%;--rot:"+r+";--maxop:"+MAXOP+";--dur:"+dur+";--delay:"+delay+";font-family:Georgia,serif;font-style:italic;font-size:"+fsize+"px;color:"+COLOR+";white-space:nowrap";
    el.textContent=txt;
    layer.appendChild(el);
    setTimeout(function(){ el.remove(); busy[cell]=false; spawn(); }, parseFloat(dur)*1000);
  }
  // staggered start so they don't all appear at once — others rise as gaps open
  for(var i=0;i<CELLS;i++){ (function(idx){ setTimeout(spawn, idx*rnd(400,1000)); })(i); }
})();
</script>
